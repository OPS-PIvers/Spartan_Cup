<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spartan Cup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1b3b87 0%, #b5121b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 900;
    }

    .logo {
      width: 120px;
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      font-size: 1rem;
      margin-top: 1rem;
      line-height: 1.6;
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    button {
      background: white;
      color: #1b3b87;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .instructions {
      font-size: 0.875rem;
      margin-top: 15px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .instructions strong {
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="spartan_cup_FINALtransparent.png" alt="Spartan Cup Logo" class="logo">
    <h1>Spartan Cup</h1>
    <div id="initial-prompt">
      <p style="margin-bottom: 20px; font-size: 0.95rem;">Location is needed to check in at events.</p>
      <button id="location-button" onclick="requestLocationPermission()">Share My Location</button>
    </div>
    <div id="spinner" style="display: none;"></div>
    <p id="status"></p>
    <div id="error-container"></div>
  </div>

  <script>
    // IMPORTANT: Replace this with your actual Google Apps Script web app URL
    // Find it in: Google Apps Script → Deploy → Manage deployments → Web app URL
    const GAS_APP_URL = 'https://script.google.com/a/orono.k12.mn.us/macros/s/AKfycbzox9ZqfP5FWJrJUpBnpUdBT8PPnDl-NroRfCUbjpPnTpllVpZS__y3pKNV13j4CX_j/exec';

    // Configuration
    const GEOLOCATION_CONFIG = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    // Check if browser supports geolocation on load
    if (!navigator.geolocation) {
      showError(
        'Geolocation Not Supported',
        'Your browser does not support location services. Please use a modern browser like Chrome, Safari, or Firefox.',
        false
      );
    }

    // Request location only after user taps button (iOS requirement)
    function requestLocationPermission() {
      document.getElementById('initial-prompt').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').textContent = 'Requesting location permission...';

      navigator.geolocation.getCurrentPosition(
        handleLocationSuccess,
        handleLocationError,
        GEOLOCATION_CONFIG
      );
    }

    function handleLocationSuccess(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const acc = position.coords.accuracy;

      document.getElementById('status').textContent = '✓ Location obtained! Loading app...';

      // FIX: Store location in localStorage instead of URL params
      // This prevents breaking google.script.run context on iOS Safari
      const locationData = {
        lat: lat,
        lon: lon,
        acc: acc,
        timestamp: Date.now()
      };
      localStorage.setItem('spartan_cup_wrapper_location', JSON.stringify(locationData));

      console.log('[Wrapper] Location stored in localStorage:', locationData);

      // Check for target page parameter (e.g., ?target=submit)
      const urlParams = new URLSearchParams(window.location.search);
      const targetPage = urlParams.get('target') || 'profile'; // Default to profile

      // Redirect WITHOUT location params (preserves google.script.run context)
      const separator = GAS_APP_URL.includes('?') ? '&' : '?';
      const targetUrl = `${GAS_APP_URL}${separator}page=${targetPage}`;

      console.log('[Wrapper] Redirecting to GAS (without location params):', {
        targetPage: targetPage,
        url: targetUrl
      });

      // Small delay so user sees success message
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    }

    function handleLocationError(error) {
      let errorMessage = '';
      let instructions = '';

      switch(error.code) {
        case error.PERMISSION_DENIED:
          errorMessage = 'Location Permission Denied';
          instructions = `
            To enable location for check-ins:
            <strong>iOS Safari:</strong>
            • Settings → Safari → Location → Allow (or While Using)
            • OR Settings → Privacy → Location Services → Safari Websites → Allow
            • Then tap "Retry Location"

            <strong>Android/Desktop:</strong> Tap the lock icon in address bar → Location → Allow
          `;
          break;
        case error.POSITION_UNAVAILABLE:
          errorMessage = 'Location Unavailable';
          instructions = 'Your device cannot determine your location. Check that Location Services are enabled in Settings → Privacy → Location Services.';
          break;
        case error.TIMEOUT:
          errorMessage = 'Location Request Timeout';
          instructions = 'The request took too long. Try again near a window or outdoors for better GPS signal.';
          break;
        default:
          errorMessage = 'Location Error';
          instructions = 'An error occurred while getting your location.';
      }

      console.error('[Wrapper] Location error:', {
        code: error.code,
        message: error.message
      });

      showError(errorMessage, instructions, true);
    }

    function showError(title, message, showRetry) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = '';

      const errorHtml = `
        <div class="error">
          <h2>⚠️ ${title}</h2>
          <p class="instructions">${message}</p>
          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            ${showRetry ? '<button onclick="location.reload()">Retry Location</button>' : ''}
            <button onclick="skipLocation()" style="background: rgba(255,255,255,0.2); color: white;">Skip & Continue</button>
          </div>
        </div>
      `;

      document.getElementById('error-container').innerHTML = errorHtml;
    }

    function skipLocation() {
      console.log('[Wrapper] User chose to skip location');
      document.getElementById('error-container').innerHTML = '';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').textContent = 'Loading app without location...';

      // Get target page from URL params
      const urlParams = new URLSearchParams(window.location.search);
      const targetPage = urlParams.get('target') || 'profile';

      // Redirect WITHOUT location data
      const separator = GAS_APP_URL.includes('?') ? '&' : '?';
      const targetUrl = `${GAS_APP_URL}${separator}page=${targetPage}`;

      console.log('[Wrapper] Redirecting without location:', targetUrl);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    }
  </script>
</body>
</html>
