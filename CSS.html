<style>
    body {
      font-family: 'display', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* This padding-bottom ensures content isn't hidden by the fixed nav bar */
      padding-bottom: 80px; 
    }
    
    /* Material Icon fill setting */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24
    }
    
    /* Simple page transition */
    .page {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Active nav state */
    .nav-item.active .material-symbols-outlined {
      color: #1b3b87; /* primary */
    }
    .nav-item.active span {
      color: #1b3b87; /* primary */
      font-weight: 700;
    }
    
    /* QR Scanner video override */
    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 1.5rem; /* 2xl */
    }

    /* QR Scanner Animation */
    @keyframes scan {
      0% { transform: translateY(0); }
      50% { transform: translateY(calc(280px - 2px)); }
      100% { transform: translateY(0); }
    }
    
    /* Leaderboard Toggle */
    .active-toggle {
      background-color: white;
      color: #1b3b87;
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1);
    }
    .dark .active-toggle {
      background-color: #374151; /* gray-700 */
      color: white;
    }

    /* Admin Dashboard Tab Buttons */
    .admin-tab-btn {
      background-color: #e5e7eb; /* gray-200 */
      color: #374151; /* gray-700 */
    }
    .dark .admin-tab-btn {
      background-color: #374151; /* gray-700 */
      color: #d1d5db; /* gray-300 */
    }

    /* Admin Tab Active State */
    .admin-tab-btn.active-tab {
      background-color: #1b3b87; /* primary */
      color: white;
    }
    .admin-tab-btn.active-tab .material-symbols-outlined {
      color: white;
    }

    /* Admin Tab Hover State */
    .admin-tab-btn:hover {
      background-color: #d1d5db; /* gray-300 */
    }
    .dark .admin-tab-btn:hover {
      background-color: #4b5563; /* gray-600 */
    }
    .admin-tab-btn.active-tab:hover {
      background-color: #152d6b; /* darker primary */
    }

    /* Admin Tab Icon Styling */
    .admin-tab-btn .material-symbols-outlined {
      color: #6b7280; /* gray-500 */
    }
    .dark .admin-tab-btn .material-symbols-outlined {
      color: #9ca3af; /* gray-400 */
    }
</style>
