<style>
    body {
      font-family: 'display', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* This padding-bottom ensures content isn't hidden by the fixed nav bar */
      padding-bottom: 80px; 
    }
    
    /* Material Icon fill setting */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24
    }
    
    /* Simple page transition */
    .page {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Active nav state */
    .nav-item.active .material-symbols-outlined {
      color: #1b3b87; /* primary */
    }
    .nav-item.active span {
      color: #1b3b87; /* primary */
      font-weight: 700;
    }
    
    /* QR Scanner video override */
    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 1.5rem; /* 2xl */
    }

    /* QR Scanner Animation */
    @keyframes scan {
      0% { transform: translateY(0); }
      50% { transform: translateY(calc(280px - 2px)); }
      100% { transform: translateY(0); }
    }
    
    /* Leaderboard Toggle */
    .active-toggle { 
      background-color: white; 
      color: #1b3b87; 
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); 
    }
    .dark .active-toggle { 
      background-color: #374151; /* gray-700 */
      color: white; 
    }
</style>
