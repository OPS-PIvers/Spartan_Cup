<!-- ===================================================================== -->
<!-- TAB: SEASON PRIZES MANAGEMENT -->
<!-- ===================================================================== -->
<div id="tab-prizes-content" class="flex-1 flex flex-col overflow-y-auto">
  <!-- Prize Form -->
  <div class="bg-white dark:bg-gray-800/50 p-4 rounded-xl shadow-sm border-l-4 border-green-600 mb-4">
    <h2 class="text-xl font-bold text-[#111318] dark:text-white mb-4">Add/Edit Season Prize</h2>

    <form id="prize-form" class="space-y-3">
      <!-- Rank/Placement -->
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-[#111318] dark:text-white">Rank/Placement *</label>
        <input
          id="prize-rank"
          type="text"
          placeholder="e.g., 1st Place, Most Spirited, Best Fan"
          required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
        >
      </div>

      <!-- Prize Description -->
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-[#111318] dark:text-white">Prize Description *</label>
        <textarea
          id="prize-description"
          rows="3"
          placeholder="e.g., $100 Gift Card, Championship Trophy, etc."
          required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
        ></textarea>
      </div>

      <!-- Submit/Cancel -->
      <div class="flex gap-2">
        <button type="submit" class="flex-1 px-4 py-2 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">
          Create Prize
        </button>
        <button type="button" id="prize-cancel-btn" class="flex-1 px-4 py-2 rounded-lg bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-semibold">
          Clear
        </button>
      </div>
    </form>
  </div>

  <!-- Prizes List -->
  <div class="flex-shrink-0">
    <h3 class="text-lg font-bold text-[#111318] dark:text-white mb-3">All Season Prizes</h3>
    <div id="prizes-list" class="space-y-3">
      <div class="text-center py-6 text-gray-500">Loading prizes...</div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // =====================================================================
  // SEASON PRIZES MANAGEMENT
  // =====================================================================

  // Prize form submission
  let editingPrizeRowIndex = null;

  document.getElementById('prize-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const rank = document.getElementById('prize-rank').value.trim();
    const description = document.getElementById('prize-description').value.trim();

    if (!rank || !description) {
      alert('Please fill in all fields');
      return;
    }

    // Show loading
    document.getElementById('loading-modal').classList.remove('hidden');

    if (editingPrizeRowIndex) {
      // Update existing prize
      google.script.run.withSuccessHandler((response) => {
        document.getElementById('loading-modal').classList.add('hidden');
        if (response.status === 'success') {
          alert(response.message);
          clearPrizeForm();
          loadPrizesList();
        } else {
          alert('Error: ' + response.message);
        }
      }).withFailureHandler((error) => {
        document.getElementById('loading-modal').classList.add('hidden');
        alert('Error: ' + error);
      }).updatePrize(editingPrizeRowIndex, rank, description);
    } else {
      // Create new prize
      google.script.run.withSuccessHandler((response) => {
        document.getElementById('loading-modal').classList.add('hidden');
        if (response.status === 'success') {
          alert(response.message);
          clearPrizeForm();
          loadPrizesList();
        } else {
          alert('Error: ' + response.message);
        }
      }).withFailureHandler((error) => {
        document.getElementById('loading-modal').classList.add('hidden');
        alert('Error: ' + error);
      }).createPrize(rank, description);
    }
  });

  // Cancel/Clear button
  document.getElementById('prize-cancel-btn').addEventListener('click', () => {
    clearPrizeForm();
  });

  function clearPrizeForm() {
    document.getElementById('prize-form').reset();
    document.querySelector('#prize-form button[type="submit"]').textContent = 'Create Prize';
    editingPrizeRowIndex = null;
  }

  // Load prizes list
  function loadPrizesList() {
    document.getElementById('prizes-list').innerHTML = '<div class="text-center py-6 text-gray-500">Loading prizes...</div>';

    google.script.run.withSuccessHandler((response) => {
      if (response.status === 'success') {
        populatePrizesList(response.prizes);
      } else {
        document.getElementById('prizes-list').innerHTML = '<div class="text-center py-6 text-red-500">Error: ' + escapeHtml(response.message) + '</div>';
      }
    }).withFailureHandler((error) => {
      document.getElementById('prizes-list').innerHTML = '<div class="text-center py-6 text-red-500">Error loading prizes: ' + escapeHtml(error.message || error.toString()) + '</div>';
    }).getAllSeasonPrizes();
  }

  function populatePrizesList(prizes) {
    const prizesList = document.getElementById('prizes-list');

    if (!prizes || prizes.length === 0) {
      prizesList.innerHTML = '<div class="text-center py-6 text-gray-500">No prizes yet. Create one above!</div>';
      return;
    }

    prizesList.innerHTML = prizes.map(prize => `
      <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="flex justify-between items-start mb-2">
          <h4 class="font-bold text-lg text-[#111318] dark:text-white">${escapeHtml(prize.rank)}</h4>
          <div class="flex gap-2">
            <button onclick="editPrize(${prize.rowIndex}, '${escapeForJs(prize.rank)}', '${escapeForJs(prize.description)}')" class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">
              Edit
            </button>
            <button onclick="deletePrizeConfirm(${prize.rowIndex}, '${escapeForJs(prize.rank)}')" class="px-3 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-700">
              Delete
            </button>
          </div>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-400">${escapeHtml(prize.description)}</p>
      </div>
    `).join('');
  }

  // Make functions globally accessible for onclick handlers
  window.editPrize = function(rowIndex, rank, description) {
    document.getElementById('prize-rank').value = rank;
    document.getElementById('prize-description').value = description;
    document.querySelector('#prize-form button[type="submit"]').textContent = 'Update Prize';
    editingPrizeRowIndex = rowIndex;

    // Scroll to form
    document.getElementById('prize-form').scrollIntoView({ behavior: 'smooth' });
  };

  window.deletePrizeConfirm = function(rowIndex, rank) {
    if (confirm(`Delete prize "${rank}"?\\n\\nThis will remove the prize from the season.`)) {
      document.getElementById('loading-modal').classList.remove('hidden');
      google.script.run.withSuccessHandler((response) => {
        document.getElementById('loading-modal').classList.add('hidden');
        if (response.status === 'success') {
          alert(response.message);
          loadPrizesList();
        } else {
          alert('Error: ' + response.message);
        }
      }).withFailureHandler((error) => {
        document.getElementById('loading-modal').classList.add('hidden');
        alert('Error: ' + error);
      }).deletePrize(rowIndex);
    }
  };

  // Helper functions for escaping HTML and JS strings
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeForJs(text) {
    return text.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
  }

  // Initialize on load
  loadPrizesList();
})();
</script>
