<!--
  This file holds the content for the 'prizes' page.
  It is dynamically injected into Index.html by Code.gs
-->
<div class="page p-4 pb-24">
  <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm space-y-4 mb-4">
    <h2 class="text-2xl font-bold text-primary dark:text-blue-300 border-b-2 border-gray-200 dark:border-gray-700 pb-2">🏆 Season Awards</h2>
    <p class="text-[#111318] dark:text-white">The top 3 fans at the end of the season win!</p>
    <ul id="season-awards-list" class="list-disc list-inside space-y-1 text-[#111318] dark:text-white">
      <li><span class="font-bold">1st Place:</span> [TBD Prize]</li>
      <li><span class="font-bold">2nd Place:</span> [TBD Prize]</li>
      <li><span class="font-bold">3rd Place:</span> [TBD Prize]</li>
    </ul>
  </div>

  <div id="superfan-awards-section" class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm space-y-4 hidden">
    <h2 class="text-2xl font-bold text-primary dark:text-blue-300 border-b-2 border-gray-200 dark:border-gray-700 pb-2">🏅 Sport Superfan Awards</h2>
    <p class="text-[#111318] dark:text-white text-sm">The top fan for each individual sport or art group wins a prize!</p>
    <ul id="superfan-awards-list" class="list-disc list-inside space-y-1 text-[#111318] dark:text-white">
      <!-- Populated by JS -->
    </ul>
  </div>

  <h2 class="text-2xl font-bold text-primary dark:text-blue-300 px-4 mt-6 mb-4">Upcoming Events</h2>
  <div id="events-container" class="space-y-3 px-4">
    <p class="text-center text-gray-500 py-8">Loading events...</p>
  </div>

  <script>
    /**
     * Escapes HTML to prevent XSS attacks
     * @param {string} str - String to escape
     * @return {string} Escaped string safe for innerHTML
     */
    function escapeHTML(str) {
      if (!str) return '';
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }

    // Defer initialization until all scripts (including JavaScript.html) have loaded
    // This prevents "getCachedEventsList is not defined" errors on first load
    window.addEventListener('load', function() {
      loadPrizes();

      // Check client-side cache first for events list
      const cachedEvents = getCachedEventsList();
      if (cachedEvents) {
        // Use cached data - no backend call needed!
        populateEvents(cachedEvents);
      } else {
        // Cache miss - fetch from backend
        google.script.run.withSuccessHandler((response) => {
          cacheEventsList(response); // Cache the response
          populateEvents(response);
        }).getEventsList();
      }
    });

    function loadPrizes() {
      const seasonList = document.getElementById('season-awards-list');
      const superfanList = document.getElementById('superfan-awards-list');
      const superfanSection = document.getElementById('superfan-awards-section');

      google.script.run.withSuccessHandler((response) => {
        if (response.status === 'error') {
          seasonList.innerHTML = '<li class="text-red-600 dark:text-red-400">Error loading prizes</li>';
          return;
        }

        if (response.prizes && response.prizes.length > 0) {
          const seasonPrizes = response.prizes.filter(p => !p.rank.toLowerCase().includes('superfan'));
          const superfanPrizes = response.prizes.filter(p => p.rank.toLowerCase().includes('superfan'));

          if (seasonPrizes.length > 0) {
            populatePrizeList(seasonList, seasonPrizes);
          }

          if (superfanPrizes.length > 0) {
            superfanSection.classList.remove('hidden');
            populatePrizeList(superfanList, superfanPrizes);
          }
        }
      }).withFailureHandler((error) => {
        seasonList.innerHTML = '<li class="text-red-600 dark:text-red-400">Error: ' + (error.message || error.toString() || 'Unknown error') + '</li>';
      }).getAllSeasonPrizes();
    }

    /**
     * Helper to populate a prize list element.
     */
    function populatePrizeList(listElement, prizes) {
      listElement.innerHTML = '';
      prizes.forEach(prize => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="font-bold">${escapeHTML(prize.rank)}:</span> ${escapeHTML(prize.description)}`;
        listElement.appendChild(li);
      });
    }

    function populateEvents(response) {
      if (response.status === 'error') {
        document.getElementById('events-container').innerHTML = '<p class="text-center text-red-600 dark:text-red-400">Error loading events</p>';
        return;
      }

      const events = response.events || [];
      const container = document.getElementById('events-container');

      // Populate events list
      if (events.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">No events scheduled.</p>';
      } else {
        container.innerHTML = '';
        events.forEach(event => {
          const card = document.createElement('div');
          card.className = 'bg-white dark:bg-gray-800/50 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700';
          card.innerHTML = `
            <div class="flex items-start justify-between mb-2">
              <div class="flex-1">
                <p class="font-bold text-[#111318] dark:text-white text-lg">${event.eventName}</p>
                <p class="text-sm text-gray-600 dark:text-gray-400">${event.sportArt}</p>
              </div>
              ${event.isSpotlightGame ? '<span class="bg-secondary/20 text-secondary dark:text-red-400 px-2 py-1 rounded text-xs font-bold">SPOTLIGHT</span>' : ''}
            </div>

            <div class="space-y-1 text-sm text-gray-600 dark:text-gray-400">
              <p><span class="material-symbols-outlined text-sm align-middle mr-1">event</span>${event.date || 'TBD'}${event.formattedStartTime ? ' at ' + event.formattedStartTime : ''}</p>
              <p><span class="material-symbols-outlined text-sm align-middle mr-1">location_on</span>${event.locationName || 'TBD'}</p>
              ${event.theme && event.theme !== 'None' ? '<p><span class="material-symbols-outlined text-sm align-middle mr-1">style</span>Theme: ' + event.theme + '</p>' : ''}
            </div>
          `;
          container.appendChild(card);
        });
      }
    }
  </script>
</div>
