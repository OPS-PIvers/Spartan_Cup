<!--
  This file holds the content for the 'all-badges' page.
  It is dynamically injected into Index.html by Code.gs
-->
<div class="page p-4 pb-24">
  <div class="space-y-4">
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold text-primary dark:text-blue-300 mb-2">All Earned Badges</h2>
      <p class="text-sm text-gray-600 dark:text-gray-400">You've earned <span id="badge-count" class="font-bold">0</span> badges!</p>
    </div>

    <div id="badges-grid" class="grid grid-cols-2 @sm:grid-cols-3 gap-4">
      <!-- Skeleton loaders for badges -->
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
      <div class="skeleton-badge-card flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm">
        <div class="skeleton w-20 h-20 rounded-full"></div>
        <div class="skeleton h-4 w-24 rounded"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
    </div>

    <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 p-4 rounded-xl">
      <p class="text-sm text-blue-900 dark:text-blue-200">
        <span class="font-bold">Keep attending events!</span> Earn more badges by supporting Orono events and completing challenges.
      </p>
    </div>
  </div>

  <script>
    // Defer initialization until all scripts (including JavaScript.html) have loaded
    // This prevents "getCachedProfileData is not defined" errors on first load
    window.addEventListener('load', function() {
      // Check client-side cache first to avoid unnecessary API call
      const cachedProfile = getCachedProfileData();
      if (cachedProfile) {
        // Use cached data - no backend call needed!
        populateAllBadges(cachedProfile);
      } else {
        // Cache miss - fetch from backend
        google.script.run.withSuccessHandler((data) => {
          cacheProfileData(data); // Cache the response
          populateAllBadges(data);
        }).getProfileData();
      }
    });

    function populateAllBadges(data) {
      const grid = document.getElementById('badges-grid');
      const badgeCount = document.getElementById('badge-count');

      if (!data.badges || data.badges.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">No badges earned yet. Check in at an event to get started!</p>';
        badgeCount.textContent = '0';
        return;
      }

      badgeCount.textContent = data.badges.length;
      grid.innerHTML = '';

      data.badges.forEach((badge, index) => {
        const badgeEl = document.createElement('div');
        badgeEl.className = 'flex flex-col items-center gap-2 p-4 rounded-xl bg-white dark:bg-gray-800/50 shadow-sm hover:shadow-md transition-shadow';
        badgeEl.innerHTML = `
          <div class="flex items-center justify-center w-20 h-20 rounded-full bg-white dark:bg-gray-700 shadow-md overflow-hidden">
            <img src="${badge.imageUrl}" alt="${badge.name}" class="w-full h-full object-cover"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="hidden items-center justify-center w-20 h-20 ${badge.color}">
              <span class="material-symbols-outlined text-4xl text-white">${badge.icon}</span>
            </div>
          </div>
          <p class="text-sm font-bold text-center text-[#111318] dark:text-white">${badge.name}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 text-center">${badge.description || 'Achievement unlocked!'}</p>
        `;
        grid.appendChild(badgeEl);
      });
    }
  </script>
</div>
