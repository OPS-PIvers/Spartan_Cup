<script>
    // --- LOCATION CACHING UTILITIES (Fixed Geolocation) ---------------------
    const LOCATION_CACHE_KEY = 'spartan_cup_location_cache';
    const LOCATION_CACHE_DURATION = 5 * 60 * 1000; // 5 minutes in milliseconds

    /**
     * Get cached location if it exists and hasn't expired
     * @return {Object|null} Location object {lat, lon, acc, timestamp} or null
     */
    function getCachedLocation() {
      try {
        const cached = sessionStorage.getItem(LOCATION_CACHE_KEY);
        if (!cached) return null;

        const data = JSON.parse(cached);
        const now = Date.now();

        // Check if cache has expired
        if (now - data.timestamp > LOCATION_CACHE_DURATION) {
          sessionStorage.removeItem(LOCATION_CACHE_KEY);
          return null;
        }

        return { lat: data.lat, lon: data.lon, acc: data.acc };
      } catch (e) {
        console.error('Error reading location cache:', e);
        return null;
      }
    }

    /**
     * Cache the user's location for 5 minutes
     * @param {Object} position - geolocation position object
     */
    function cacheLocation(position) {
      try {
        const data = {
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          acc: position.coords.accuracy,
          timestamp: Date.now()
        };
        sessionStorage.setItem(LOCATION_CACHE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error('Error caching location:', e);
      }
    }

    /**
     * Check current permission status (iOS may not support this)
     * @return {Promise<string>} 'granted', 'denied', 'prompt', or 'unknown'
     */
    async function checkLocationPermission() {
      try {
        if (!navigator.permissions) {
          return 'unknown'; // Permissions API not supported
        }
        const result = await navigator.permissions.query({ name: 'geolocation' });
        return result.state;
      } catch (e) {
        console.error('Error checking permission:', e);
        return 'unknown';
      }
    }

    /**
     * Test if geolocation actually works (for iOS Safari where Permissions API doesn't work)
     * This actively tries to get location to verify it's enabled
     * @param {Function} onGranted - Callback when location is available
     * @param {Function} onDenied - Callback when location is denied/unavailable
     */
    function testLocationAccess(onGranted, onDenied) {
      if (!navigator.geolocation) {
        console.error('Geolocation not supported');
        onDenied('not_supported');
        return;
      }

      // Detect iOS Safari iframe issue
      const isInIframe = window.self !== window.top;
      const isIOSSafari = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      console.log('Testing geolocation:', {
        isInIframe: isInIframe,
        isIOSSafari: isIOSSafari,
        userAgent: navigator.userAgent
      });

      // Try to get location with short timeout - just testing permission
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // Success - permission is granted and working
          console.log('Geolocation success:', position.coords);
          cacheLocation(position); // Cache it while we're at it
          onGranted({
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy
          });
        },
        (error) => {
          // Failed - determine why
          console.error('Geolocation error:', {
            code: error.code,
            message: error.message,
            PERMISSION_DENIED: error.PERMISSION_DENIED,
            POSITION_UNAVAILABLE: error.POSITION_UNAVAILABLE,
            TIMEOUT: error.TIMEOUT
          });

          if (error.code === error.PERMISSION_DENIED) {
            // On iOS Safari in iframe, this might be a security restriction
            if (isIOSSafari && isInIframe) {
              onDenied('ios_iframe_blocked');
            } else {
              onDenied('denied');
            }
          } else if (error.code === error.TIMEOUT) {
            onDenied('timeout');
          } else {
            onDenied('unavailable');
          }
        },
        {
          enableHighAccuracy: false, // Use low accuracy for faster test
          timeout: 5000, // 5 second timeout for test
          maximumAge: 300000 // Allow 5-minute cached position for this test
        }
      );
    }

    /**
     * Validate that location coordinates are reasonable (sanity check)
     * @param {Object} location - Location object {lat, lon, acc}
     * @return {boolean} True if location values are valid
     */
    function isValidLocation(location) {
      if (!location || typeof location.lat !== 'number' || typeof location.lon !== 'number') {
        return false;
      }
      // Check latitude is between -90 and 90
      if (location.lat < -90 || location.lat > 90) {
        console.warn('[Location] Invalid latitude:', location.lat);
        return false;
      }
      // Check longitude is between -180 and 180
      if (location.lon < -180 || location.lon > 180) {
        console.warn('[Location] Invalid longitude:', location.lon);
        return false;
      }
      // Check accuracy is reasonable (>0 and <50km)
      if (!location.acc || location.acc < 0 || location.acc > 50000) {
        console.warn('[Location] Invalid accuracy:', location.acc);
        return false;
      }
      return true;
    }

    /**
     * Calculate distance between two geographic coordinates using Haversine formula
     * @param {number} lat1 - Latitude of point 1
     * @param {number} lon1 - Longitude of point 1
     * @param {number} lat2 - Latitude of point 2
     * @param {number} lon2 - Longitude of point 2
     * @return {number} Distance in meters
     */
    function calculateDistanceClient(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth's radius in meters
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c; // Returns distance in meters
    }

    /**
     * Request user location with caching and proper error handling
     * NOW checks if location was passed from Firebase wrapper first
     * @param {Function} onSuccess - Callback with location {lat, lon, acc}
     * @param {Function} onError - Callback with error message
     * @param {boolean} forceRefresh - Skip cache and request fresh location
     */
    function requestLocation(onSuccess, onError, forceRefresh = false) {
      // PRIORITY 1: Check if location was passed from Firebase wrapper (NEW)
      // This allows iOS Safari to work by capturing location BEFORE entering the GAS iframe
      if (!forceRefresh && APP_DATA.userLat !== null && APP_DATA.userLon !== null) {
        console.log('[Location] Using location from Firebase wrapper');
        const wrapperLocation = {
          lat: parseFloat(APP_DATA.userLat),
          lon: parseFloat(APP_DATA.userLon),
          acc: parseFloat(APP_DATA.userAcc)
        };
        // Validate location values are reasonable (sanity check)
        if (isValidLocation(wrapperLocation)) {
          onSuccess(wrapperLocation);
          return;
        } else {
          console.warn('[Location] Wrapper provided invalid location values, falling back to cache');
        }
      }

      // PRIORITY 2: Try to use cached location (unless forced refresh)
      if (!forceRefresh) {
        const cached = getCachedLocation();
        if (cached) {
          console.log('[Location] Using cached location');
          onSuccess(cached);
          return;
        }
      }

      if (!navigator.geolocation) {
        onError('Geolocation is not supported by your browser');
        return;
      }

      // PRIORITY 3: Request fresh location from browser
      console.log('[Location] Requesting fresh location from browser');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          console.log('[Location] Got fresh location from browser');
          cacheLocation(position);
          onSuccess({
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy
          });
        },
        (error) => {
          let message = 'Unable to get your location.';

          if (error.code === error.PERMISSION_DENIED) {
            message = 'Location permission denied. Please enable location in Settings > Safari > Spartan Cup (iOS) or browser settings.';
          } else if (error.code === error.TIMEOUT) {
            message = 'Location request timed out. Please try again.';
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = 'Your location is unavailable. Please check GPS.';
          }

          console.error('[Location] Error:', message);
          onError(message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0 // Don't use browser cache; let our session cache handle it
        }
      );
    }

    // --- STATE & PAGE ROUTING -----------------------------------------------
    let html5QrCode = null;

    // Page titles map
    const TITLES = {
      'profile': 'My Profile',
      'history': 'Event History',
      'prizes': 'Prizes & Awards',
      'fanfeed': 'Fan Feed',
      'scanner': 'Scan Event Code',
      'event-select': 'Select Event',
      'submit': 'Submit Attendance',
      'settings': 'Settings',
      'all-badges': 'All Badges',
      'admin': 'Admin Dashboard',
      'qr-code': 'QR Code'
    };

    /**
     * Main function to navigate between pages using URL parameters
     * @param {string} pageName - The ID of the page to show (e.g., 'profile')
     */
    function navigateToPage(pageName) {
      if (pageName) {
        // Show loading spinner immediately for better UX
        const loadingModal = document.getElementById('loading-modal');
        if(loadingModal) loadingModal.classList.remove('hidden');

        // Add a small delay so the loading modal is visible before the page reloads
        // This ensures the user sees visual feedback that their click registered
        setTimeout(() => {
          // Use window.top.location with base target="_top" in Index.html for proper navigation
          window.top.location.href = APP_DATA.appUrl + '?page=' + pageName;
        }, 250);  // 250ms delay gives a clear visual indication
      }
    }

    // --- QR SCANNER LOGIC ---------------------------------------------------
    
    /** Start the QR Code scanner */
    function startScanner() {
      // Prevent starting multiple scanners
      if (html5QrCode && html5QrCode.isScanning) {
        return;
      }

      // Clean up any existing camera elements to prevent duplicates
      const readerDiv = document.getElementById('qr-reader');
      if (readerDiv) {
        readerDiv.innerHTML = '';
      }

      html5QrCode = new Html5Qrcode("qr-reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, // Use rear camera
        config,
        (decodedText, decodedResult) => { // onScanSuccess
          console.log(`Scan result: ${decodedText}`, decodedResult);
          stopScanner();
          
          try {
            // Validate that it's our app's URL
            const url = new URL(decodedText);
            if (url.origin !== new URL(APP_DATA.appUrl).origin) {
              alert('Invalid QR Code. Not a Spartan Cup code.');
              return;
            }

            // Check for event parameter, but don't require it
            // The app will auto-detect the event based on user location
            const eventId = url.searchParams.get('event');
            if (eventId) {
              // Navigate to the submit page with the eventId
              navigateToPage('submit&event=' + eventId);
            } else {
              // No event ID in QR code - navigate to event selection page to auto-detect by location
              navigateToPage('event-select');
            }
          } catch (e) {
            console.error(e);
            alert('Scanned code is not a valid event URL.');
          }
        },
        (error) => { /* onScanFailure, optional */ }
      );
    }
    
    /** Stop the QR Code scanner */
    function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          console.log("QR Scanner stopped.");
        }).catch(err => {
          console.error("Failed to stop QR scanner:", err);
        });
        html5QrCode = null;
      }
    }

    /** Load and display events sorted by distance for selection */
    function loadEventsByDistance() {
      const loadingState = document.getElementById('loading-state');
      const eventsList = document.getElementById('events-list');
      const errorState = document.getElementById('error-state');
      const noEventsState = document.getElementById('no-events-state');
      const loadButton = document.getElementById('load-events-button');

      // Show loading state and hide button
      loadingState.classList.remove('hidden');
      if (loadButton) loadButton.classList.add('hidden');

      // Request user location (will use cache if available)
      requestLocation(
        (location) => {
          // Success: Fetch active events sorted by distance
          google.script.run.withSuccessHandler((events) => {
            loadingState.classList.add('hidden');

            if (!events || events.length === 0) {
              noEventsState.classList.remove('hidden');
              return;
            }

            // Display events
            eventsList.innerHTML = '';
            events.forEach((event, index) => {
              const isClosest = index === 0;
              const card = document.createElement('div');
              card.className = `event-card p-4 rounded-lg border cursor-pointer transition-all hover:shadow-lg ${
                isClosest
                  ? 'event-card-closest'
                  : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800'
              }`;
              card.innerHTML = `
                <div class="flex items-start justify-between">
                  <div class="flex-1">
                    <h3 class="font-bold text-[#111318] dark:text-white">${event.eventName}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">📍 ${event.locationName}</p>
                    <p class="text-sm text-primary dark:text-blue-300 font-semibold mt-2">Code: ${event.eventCode}</p>
                  </div>
                  <div class="text-right">
                    <div class="text-lg font-bold text-gray-700 dark:text-gray-300">${event.distance}m</div>
                    ${isClosest ? '<div class="text-xs text-primary dark:text-blue-300 font-bold mt-1">Closest</div>' : ''}
                  </div>
                </div>
              `;
              card.addEventListener('click', () => selectEvent(event.eventCode));
              eventsList.appendChild(card);
            });

            eventsList.classList.remove('hidden');
          }).withFailureHandler((error) => {
            console.error('Error loading events:', error);
            loadingState.classList.add('hidden');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = 'Error loading events: ' + error.message;
            errorState.classList.remove('hidden');
          }).getEventsByDistance(location.lat, location.lon);
        },
        (errorMessage) => {
          // Error: Show error message
          loadingState.classList.add('hidden');
          const errorElement = document.getElementById('error-message');
          errorElement.textContent = errorMessage;
          errorState.classList.remove('hidden');
          console.error('Geolocation error:', errorMessage);
        }
      );
    }

    /** Navigate to submit page with selected event code */
    function selectEvent(eventCode) {
      navigateToPage('submit&eventCode=' + eventCode);
    }

    /** COMMENTED OUT: Show modal for manually entering an event code - users should scan QR codes instead
    function enterCodeManually() {
      stopScanner();
      document.getElementById('manual-code-modal').classList.remove('hidden');
      document.getElementById('manual-code-input').focus();
    }
    */

    // --- EVENT LISTENERS ----------------------------------------------------
    
    document.addEventListener('DOMContentLoaded', () => {
      // IMPORTANT: Initialize settings FIRST before any page rendering
      // This ensures dark mode and other settings are applied before the page displays
      // Settings are loaded from the server via APP_DATA.userSettings
      if (APP_DATA.userSettings && APP_DATA.userSettings.darkMode) {
        document.documentElement.classList.add('dark');
      }

      // 1. Set Page Title from the APP_DATA passed from server
      const pageKey = APP_DATA.page.split('&')[0]; // Get base page (e.g., 'submit' from 'submit&event=123')
      document.getElementById('page-title').innerText = TITLES[pageKey] || 'The Spartan Cup';
      
      // 2. Set Active Nav Item
      const activeNavItem = document.querySelector(`.nav-item[data-page="${pageKey}"]`);
      if (activeNavItem) activeNavItem.classList.add('active');

      // 3. Handle Back/Settings Buttons
      const backButton = document.getElementById('header-back-button');
      const settingsButton = document.getElementById('settings-button');
      
      if (pageKey !== 'profile') {
        backButton.classList.remove('hidden');
        backButton.addEventListener('click', () => navigateToPage('profile')); // Always go back to profile
      }
      settingsButton.addEventListener('click', () => navigateToPage('settings'));

      // --- PAGE-SPECIFIC LOGIC (using 'pageKey' for safety) ---
      
      if (pageKey === 'profile') {
        document.getElementById('scan-qr-button').addEventListener('click', () => {
          // Redirect to Firebase wrapper to capture geolocation, then return to auto-submit
          const returnUrl = APP_DATA.appUrl + '?page=auto-submit';
          window.top.location.href = 'https://the-spartan-cup.web.app/?return=' + encodeURIComponent(returnUrl);
        });
        document.getElementById('event-history-button').addEventListener('click', () => navigateToPage('history'));
        
        // Admin button event listener (visibility controlled by populateProfile based on data.isAdmin)
        const adminButton = document.getElementById('admin-button');
        if (adminButton) {
          adminButton.addEventListener('click', () => {
            // Show admin menu modal (replaces confirm() which breaks user activation)
            document.getElementById('admin-menu-modal').classList.remove('hidden');
          });
        }
        
        // Leaderboard Toggle
        document.getElementById('leaderboard-toggle').addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('#leaderboard-toggle button').forEach(btn => btn.classList.remove('active-toggle'));
            e.target.classList.add('active-toggle');
            // Switch between season and all-time leaderboards
            const view = e.target.dataset.view;
            const lbContainer = document.getElementById('leaderboard-container');
            const leaderboard = view === 'season' ? currentProfileData.leaderboard : currentProfileData.allTimeLeaderboard;
            updateLeaderboardDisplay(leaderboard);
          }
        });
        
        // Load dynamic profile data
        google.script.run.withSuccessHandler(populateProfile).getProfileData();
      }
      
      if (pageKey === 'event-select') {
        // Don't auto-load events; wait for user to click the button
        const loadButton = document.getElementById('load-events-button');
        if (loadButton) {
          loadButton.addEventListener('click', loadEventsByDistance);
        } else {
          // If button doesn't exist, try loading anyway (fallback)
          loadEventsByDistance();
        }
      }

      if (pageKey === 'scanner') {
        document.getElementById('scanner-close-button').addEventListener('click', () => navigateToPage('profile'));
        // COMMENTED OUT: Manual entry button is hidden - users should scan QR codes
        // document.getElementById('manual-entry-button').addEventListener('click', enterCodeManually);
        startScanner(); // Auto-start scanner
      }
      
      if (pageKey === 'history') {
        // Load dynamic history data
        google.script.run.withSuccessHandler(populateHistory).getProfileData(); // Re-using getProfileData
      }
      
      if (pageKey === 'all-badges') {
        document.getElementById('view-all-badges-button').addEventListener('click', () => navigateToPage('all-badges'));
      }

      if (pageKey === 'qr-code') {
        // QR code page - admin only, auto-initializes via script in the page
        if (!APP_DATA.isAdmin) {
          document.getElementById('page-title').innerText = 'Access Denied';
          document.body.innerHTML = '<div class="p-4"><p class="text-red-500">Admin access required.</p></div>';
        }
      }

      if (pageKey === 'admin') {
        // Admin dashboard - admin only
        if (!APP_DATA.isAdmin) {
          document.getElementById('page-title').innerText = 'Access Denied';
          document.body.innerHTML = '<div class="p-4"><p class="text-red-500">Admin access required.</p></div>';
        }
      }

      if (pageKey === 'auto-submit') {
        // Auto-detect closest event based on user location from Firebase wrapper
        console.log('[Auto-Submit] Checking for location data...');

        // Check if location was captured by Firebase wrapper
        if (APP_DATA.userLat !== null && APP_DATA.userLon !== null) {
          const userLocation = {
            lat: parseFloat(APP_DATA.userLat),
            lon: parseFloat(APP_DATA.userLon),
            acc: parseFloat(APP_DATA.userAcc)
          };

          console.log('[Auto-Submit] Location found:', userLocation);

          // Fetch events sorted by distance
          google.script.run
            .withSuccessHandler((events) => {
              console.log('[Auto-Submit] Events received:', events);

              if (events && events.length > 0) {
                const closestEvent = events[0];
                const GEOFENCE_RADIUS_METERS = 100;

                if (closestEvent.distance <= GEOFENCE_RADIUS_METERS) {
                  // Within range! Redirect to submit page with this event
                  console.log('[Auto-Submit] Event found within range:', closestEvent);
                  navigateToPage('submit&eventCode=' + closestEvent.eventCode);
                } else {
                  // Too far from any event
                  console.log('[Auto-Submit] Closest event is', closestEvent.distance, 'm away');
                  const message = `The nearest event is ${closestEvent.distance}m away. You must be within 100m to check in.`;
                  document.getElementById('no-event-message').textContent = message;
                  document.getElementById('auto-submit-loading').classList.add('hidden');
                  document.getElementById('no-event-modal').classList.remove('hidden');
                }
              } else {
                // No active events at all
                console.log('[Auto-Submit] No active events found');
                document.getElementById('no-event-message').textContent = 'There are no active events at this time.';
                document.getElementById('auto-submit-loading').classList.add('hidden');
                document.getElementById('no-event-modal').classList.remove('hidden');
              }
            })
            .withFailureHandler((error) => {
              console.error('[Auto-Submit] Error fetching events:', error);
              document.getElementById('no-event-message').textContent = 'Error checking for events. Please try again.';
              document.getElementById('auto-submit-loading').classList.add('hidden');
              document.getElementById('no-event-modal').classList.remove('hidden');
            })
            .getEventsByDistance(userLocation.lat, userLocation.lon);
        } else {
          // Location not available - shouldn't happen if coming from Firebase wrapper
          console.error('[Auto-Submit] No location data available');
          document.getElementById('no-event-message').textContent = 'Location permission denied. Please enable location access and try again.';
          document.getElementById('auto-submit-loading').classList.add('hidden');
          document.getElementById('no-event-modal').classList.remove('hidden');
        }

        // Setup modal close button
        document.getElementById('no-event-close').addEventListener('click', () => {
          navigateToPage('profile');
        });
      }

      if (pageKey === 'submit') {
        document.getElementById('submission-form').addEventListener('submit', handleFormSubmit);

        // Try to auto-populate event from URL parameter, but don't request location yet
        const urlParams = new URLSearchParams(window.location.search);
        const eventCode = urlParams.get('eventCode');

        if (eventCode) {
          // User came from event selection, populate the event code
          document.getElementById('event-code-input').value = eventCode;
          // Load the event details via backend
          google.script.run.withSuccessHandler((eventData) => {
            populateEventDetails(eventData);

            // Calculate and display distance if we have location data
            if (APP_DATA.userLat !== null && APP_DATA.userLon !== null && eventData.eventLat && eventData.eventLon) {
              const distance = calculateDistanceClient(
                parseFloat(APP_DATA.userLat),
                parseFloat(APP_DATA.userLon),
                eventData.eventLat,
                eventData.eventLon
              );

              const distanceText = distance < 1000
                ? `You are ${Math.round(distance)}m from this event`
                : `You are ${(distance / 1000).toFixed(1)}km from this event`;

              document.getElementById('event-distance-text').textContent = distanceText;
              document.getElementById('event-distance').classList.remove('hidden');
            }
          }).getEventDetails(eventCode);
        } else {
          // No event selected; show a message to the user
          document.getElementById('event-name').value = "Scan a QR code to select an event";
        }

        // Test location permission status and update UI dynamically
        updateLocationStatus();
      }

      // Onboarding - Shows on first visit per session
      // (Actual onboarding modal logic is in Code.js using sessionStorage)
      const onboardingAgree = document.getElementById('onboarding-agree');
      if (onboardingAgree) {
        onboardingAgree.addEventListener('click', () => {
          document.getElementById('onboarding-modal').classList.add('hidden');
        });
      }

      // Modal Buttons
      const modalCancel = document.getElementById('modal-cancel');
      if (modalCancel) {
        modalCancel.addEventListener('click', () => {
          document.getElementById('confirm-modal').classList.add('hidden');
          pendingFormData = null;
          pendingPhotoBlob = null;
        });
      }

      const modalProceed = document.getElementById('modal-proceed');
      if (modalProceed) {
        modalProceed.addEventListener('click', () => {
          document.getElementById('confirm-modal').classList.add('hidden');
          // Call the resubmit function
          if (pendingFormData && pendingPhotoBlob) {
            document.getElementById('loading-modal').classList.remove('hidden');
            google.script.run
              .withSuccessHandler(handleSubmissionResponse)
              .withFailureHandler(handleFailure)
              .resubmitEvent(pendingFormData, pendingPhotoBlob);
          }
          pendingFormData = null;
          pendingPhotoBlob = null;
        });
      }

      // Manual Code Entry Modal
      const manualCodeCancel = document.getElementById('manual-code-cancel');
      if (manualCodeCancel) {
        manualCodeCancel.addEventListener('click', () => {
          document.getElementById('manual-code-modal').classList.add('hidden');
          document.getElementById('manual-code-input').value = '';
        });
      }

      const manualCodeForm = document.getElementById('manual-code-form');
      if (manualCodeForm) {
        manualCodeForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const eventId = document.getElementById('manual-code-input').value.trim();
          if (eventId && eventId.length > 2) {
            document.getElementById('manual-code-modal').classList.add('hidden');
            document.getElementById('manual-code-input').value = '';
            navigateToPage('submit&event=' + eventId);
          } else {
            alert('Please enter a valid event code (at least 3 characters)');
          }
        });
      }

      // Admin Menu Modal
      const adminMenuCancel = document.getElementById('admin-menu-cancel');

      if (adminDashboardBtn) {
        adminDashboardBtn.addEventListener('click', () => {
          document.getElementById('admin-menu-modal').classList.add('hidden');
          navigateToPage('admin');
        });

      const adminQrcodeBtn = document.getElementById('admin-qrcode-btn');
      if (adminQrcodeBtn) {
        adminQrcodeBtn.addEventListener('click', () => {
          document.getElementById('admin-menu-modal').classList.add('hidden');

    // --- SHARED STATE ---
    let currentProfileData = null; // Store full profile data for leaderboard toggling

    // --- HELPER FUNCTIONS ---
    function updateLeaderboardDisplay(leaderboard) {
      const lbContainer = document.getElementById('leaderboard-container');
      // Build HTML as a single string instead of repeated += operations
      let html = '';
      leaderboard.forEach(item => {
        html += `
          <div class="flex items-center gap-3 rounded-lg p-3 ${item.rank === 1 ? 'bg-primary/10 dark:bg-primary/20' : ''}">
            <span class="font-bold text-lg ${item.rank === 1 ? 'text-primary dark:text-blue-300' : 'text-gray-500 dark:text-gray-400'} w-5 text-center">${item.rank}</span>
            <span class="material-symbols-outlined text-2xl ${item.color}">${item.icon}</span>
            <span class="flex-1 truncate font-medium text-[#111318] dark:text-white">${item.name}</span>
            <span class="font-bold ${item.rank === 1 ? 'text-primary dark:text-blue-300' : 'text-gray-600 dark:text-gray-300'}">${item.points} PTS</span>
          </div>`;
      });
      lbContainer.innerHTML = html; // Single insert operation
    }

    // --- DATA POPULATION ---
    function populateProfile(data) {
      // Store data for leaderboard toggling
      currentProfileData = data;

      document.getElementById('profile-name').innerText = APP_DATA.userName;
      document.getElementById('profile-email').innerText = APP_DATA.userEmail;
      document.getElementById('profile-photo').style.backgroundImage = `url('${APP_DATA.userPhoto}')`;
      document.getElementById('profile-points').innerText = data.seasonPoints;
      document.getElementById('profile-rank').innerText = `#${data.seasonRank}`;
      document.getElementById('profile-alltime').innerText = `${data.allTimePoints} PTS / Rank #${data.allTimeRank}`;

      // CLIENT-SIDE ADMIN CHECK: Show admin button only if data.isAdmin is true
      const adminButton = document.getElementById('admin-button');
      if (adminButton) {
        if (data.isAdmin === true) {
          adminButton.classList.remove('hidden');
        } else {
          adminButton.classList.add('hidden');
        }
      }

      const badgeContainer = document.getElementById('badge-container');
      // Build HTML as a single string instead of repeated += operations
      let badgeHtml = '';
      data.badges.forEach(badge => {
        badgeHtml += `
          <div class="flex flex-col items-center gap-1 shrink-0">
            <div class="flex items-center justify-center w-14 h-14 rounded-full ${badge.color} text-white shadow-md">
              <span class="material-symbols-outlined text-3xl">${badge.icon}</span>
            </div>
            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">${badge.name}</span>
          </div>`;
      });
      badgeHtml += document.getElementById('view-all-badges-template').innerHTML; // Add back the 'View All'
      badgeContainer.innerHTML = badgeHtml; // Single insert operation
      badgeContainer.querySelector('#view-all-badges-button').addEventListener('click', () => navigateToPage('all-badges'));

      // Populate leaderboard (season by default)
      updateLeaderboardDisplay(data.leaderboard);
    }
    
    function populateHistory(data) {
      document.getElementById('history-points').innerText = data.seasonPoints;
      const historyContainer = document.getElementById('history-container');
      // Build HTML as a single string instead of repeated += operations
      let historyHtml = '';
      data.history.forEach(item => {
        let statusColor = item.status === 'Approved' ? 'text-green-600' : (item.status === 'Pending' ? 'text-gray-500' : 'text-red-600');
        historyHtml += `
          <div class="flex items-center gap-4 rounded-xl bg-white dark:bg-gray-800/50 p-4 shadow-sm ${item.status !== 'Approved' ? 'opacity-60' : ''}">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20">
              <span class="material-symbols-outlined text-3xl ${item.color}">${item.icon}</span>
            </div>
            <div class="flex-1">
              <p class="font-bold text-[#111318] dark:text-white">${item.name}</p>
              <p class="text-sm text-gray-500 dark:text-gray-400">${item.date}</p>
            </div>
            <div class="text-right">
              <p class="text-lg font-bold ${item.color}">${item.status === 'Approved' ? '+' + item.points + ' PTS' : '+0 PTS'}</p>

              <span class="text-xs font-semibold ${statusColor}">${item.status}</span>
            </div>
          </div>`;
      });
      historyContainer.innerHTML = historyHtml; // Single insert operation
    }

    /**
     * Populate the event details on the submit page
     * Displays sport + event name (e.g., "Girls Basketball vs. Edina")
     */
    function populateEventDetails(eventData) {
      if (eventData.status === 'error') {
        document.getElementById('event-name').value = 'Error: ' + eventData.message;
        return;
      }

      // Combine Sport (Column B) + Event Name (Column C)
      const displayName = eventData.sportArt + ' ' + eventData.eventName;
      document.getElementById('event-name').value = displayName;
    }

    /**
     * Update the location permission status UI on submit page
     * This is a global function so onclick handlers can call it
     */
    function updateLocationStatus() {
      const statusDiv = document.getElementById('location-notice');
      if (!statusDiv) return;

      // Show checking state
      statusDiv.className = 'mb-4 p-3 rounded-lg bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700';
      statusDiv.innerHTML = '<p class="text-sm text-gray-600 dark:text-gray-300">🔄 Checking location status...</p>';

      // Test if location actually works
      testLocationAccess(
        (location) => {
          // Success - location is enabled and working!
          statusDiv.className = 'mb-4 p-3 rounded-lg bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800';
          statusDiv.innerHTML = `
            <p class="text-sm text-green-900 dark:text-green-100">
              <span class="font-semibold">✅ Location Enabled</span> - Ready to submit!
            </p>
            <p class="text-xs text-green-800 dark:text-green-200 mt-1">
              Accuracy: ${Math.round(location.acc)}m
            </p>
          `;
        },
        (errorType) => {
          // Failed - show appropriate error message
          statusDiv.className = 'mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800';

          let message = '';
          if (errorType === 'ios_iframe_blocked') {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">❌ iOS Safari Not Supported</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-2">
                <strong>Safari blocks location in this app.</strong> This is an Apple security restriction that cannot be fixed, even with Settings enabled.
              </p>
              <div class="mt-3 p-3 bg-blue-50 dark:bg-blue-900/40 rounded-lg border-2 border-blue-500 dark:border-blue-400">
                <p class="text-sm font-bold text-blue-900 dark:text-blue-100 mb-2">✅ REQUIRED: Use Chrome on iPhone</p>
                <p class="text-xs text-blue-900 dark:text-blue-100 mb-2">
                  <strong>1.</strong> Install "Chrome" from the App Store (free)<br>
                  <strong>2.</strong> Open this link in Chrome<br>
                  <strong>3.</strong> Location will work immediately
                </p>
                <p class="text-xs text-blue-700 dark:text-blue-200 italic">
                  Chrome doesn't have Safari's iframe restrictions and works perfectly with this app.
                </p>
              </div>
              <a href="https://apps.apple.com/us/app/google-chrome/id535886823" target="_blank" class="mt-3 w-full text-sm bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold block text-center">
                📱 Download Chrome from App Store
              </a>
            `;
          } else if (errorType === 'denied') {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">❌ Location Permission Denied</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-2">
                <strong>iOS Safari:</strong> Settings → Safari → Location Services → While Using → Find "script.google.com" or refresh this page to see the permission prompt<br>
                <strong>Chrome:</strong> Click the location icon in the address bar and select "Allow"
              </p>
              <button onclick="updateLocationStatus()" class="mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                Recheck Permission
              </button>
            `;
          } else if (errorType === 'timeout') {
            message = `
              <p class="text-sm text-yellow-900 dark:text-yellow-100">
                <span class="font-semibold">⏱️ Location Timeout</span> - GPS signal weak
              </p>
              <p class="text-xs text-yellow-800 dark:text-yellow-200 mt-1">
                Try moving outdoors or near a window, then click recheck.
              </p>
              <button onclick="updateLocationStatus()" class="mt-2 text-xs bg-yellow-600 text-white px-3 py-1 rounded hover:bg-yellow-700">
                Recheck Location
              </button>
            `;
            statusDiv.className = 'mb-4 p-3 rounded-lg bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-800';
          } else {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">📍 Location Unavailable</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-1">
                Check that Location Services are enabled in your device settings.
              </p>
              <button onclick="updateLocationStatus()" class="mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                Recheck Location
              </button>
            `;
          }

          statusDiv.innerHTML = message;
        }
      );
    }

    // --- FORM SUBMISSION ---
    let pendingFormData = null;
    let pendingPhotoBlob = null;
    
    function handleFormSubmit(e) {
      e.preventDefault();
      document.getElementById('loading-modal').classList.remove('hidden');

      const photoFile = document.getElementById('photo-input').files[0];
      if (!photoFile) {
        alert('Please select a photo!');
        document.getElementById('loading-modal').classList.add('hidden');
        return;
      }

      const formData = {
        eventId: new URLSearchParams(window.location.search).get('event'),
        eventCode: document.getElementById('event-code-input')?.value || '',
        theme: document.getElementById('theme-check').checked,
        notes: document.getElementById('notes').value,
        location: null
      };

      // Request location (will use cache if available within 5 minutes)
      requestLocation(
        (location) => {
          // Success: Location obtained
          formData.location = location;

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // OPTIMIZED PHOTO COMPRESSION
              // Calculate optimal dimensions while maintaining aspect ratio
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const MAX_HEIGHT = 600;
              let width = img.width;
              let height = img.height;

              // Maintain aspect ratio
              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d', { alpha: false }); // Disable alpha channel for smaller size

              // Use higher quality rendering
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, width, height);

              // Adaptive quality: use lower quality for smaller dimensions to reduce file size
              let quality = 0.75; // Default 75% quality
              if (width <= 400 || height <= 300) {
                quality = 0.65; // Smaller images: lower quality (65%)
              } else if (width <= 600 && height <= 450) {
                quality = 0.70; // Medium images: 70%
              }

              // Encode as progressive JPEG for faster perceived loading
              const dataUrl = canvas.toDataURL('image/jpeg', quality);

              const photoBlob = dataUrl;
              pendingFormData = formData;
              pendingPhotoBlob = photoBlob;

              google.script.run
                .withSuccessHandler(handleSubmissionResponse)
                .withFailureHandler(handleFailure)
                .submitEvent(formData, photoBlob);
            }
            img.src = e.target.result;
          };
          reader.readAsDataURL(photoFile);
        },
        (errorMessage) => {
          // Error: Location not available
          console.error('Geolocation error:', errorMessage);
          document.getElementById('loading-modal').classList.add('hidden');
          alert(`Location Required: ${errorMessage}\n\nPlease enable location in your browser settings and try again.`);
        }
      );
    }

    function handleSubmissionResponse(response) {
      if (response.status === "success") {
        // Show success message and reload
        alert(response.message);
        // Navigate immediately without setTimeout to preserve user activation
        window.location.href = APP_DATA.appUrl + '?page=profile';

      } else if (response.status === "pending_conflict") {
        document.getElementById('loading-modal').classList.add('hidden');
        document.getElementById('modal-message').innerText = response.message;
        document.getElementById('confirm-modal').classList.remove('hidden');
        // pendingFormData and pendingPhotoBlob are already set

      } else if (response.status === "error") {
        document.getElementById('loading-modal').classList.add('hidden');
        alert(response.message);
      }
    }

    function handleFailure(error) {
      document.getElementById('loading-modal').classList.add('hidden');
      alert('A critical error occurred: ' + error.message);
    }
  </script>
