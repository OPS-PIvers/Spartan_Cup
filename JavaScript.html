<script>
    // --- CACHING UTILITIES ---------------------

    /**
     * Generic cache utility for client-side data caching
     * Provides get, set, clear, and age checking for any data type
     * Uses sessionStorage for persistence across page navigations (within same session)
     * @namespace CacheManager
     */
    const CacheManager = {
      /**
       * Get cached data if it exists and hasn't expired
       * @param {string} key - Cache key identifier
       * @param {number} ttl - Time-to-live in milliseconds
       * @param {string} label - Human-readable label for console logging (optional)
       * @return {*|null} Cached data or null if expired/missing
       */
      get: function(key, ttl, label = key) {
        try {
          const cached = sessionStorage.getItem(key);
          if (!cached) return null;

          const data = JSON.parse(cached);
          const now = Date.now();
          const age = now - data.timestamp;

          // Check if cache has expired
          if (age > ttl) {
            sessionStorage.removeItem(key);
            console.log(`📦 [Cache] ${label} expired (age: ${Math.round(age/1000)}s)`);
            return null;
          }

          const ageMinutes = Math.floor(age / 60000);
          const ageSeconds = Math.floor((age % 60000) / 1000);
          console.log(`📦 [Cache HIT] ${label} (age: ${ageMinutes}m ${ageSeconds}s)`);
          return data.value;
        } catch (e) {
          console.error(`[Cache] Error reading ${label}:`, e);
          return null;
        }
      },

      /**
       * Cache data with timestamp
       * @param {string} key - Cache key identifier
       * @param {*} value - Data to cache (must be JSON-serializable)
       * @param {string} label - Human-readable label for console logging (optional)
       */
      set: function(key, value, label = key) {
        try {
          const data = {
            value: value,
            timestamp: Date.now()
          };
          sessionStorage.setItem(key, JSON.stringify(data));
          console.log(`💾 [Cache SAVE] ${label}`);
        } catch (e) {
          console.error(`[Cache] Error saving ${label}:`, e);
        }
      },

      /**
       * Clear specific cached data
       * @param {string} key - Cache key to clear
       * @param {string} label - Human-readable label for console logging (optional)
       */
      clear: function(key, label = key) {
        try {
          sessionStorage.removeItem(key);
          console.log(`🗑️ [Cache CLEAR] ${label}`);
        } catch (e) {
          console.error(`[Cache] Error clearing ${label}:`, e);
        }
      },

      /**
       * Clear all Spartan Cup caches (useful for logout or major updates)
       * Clears both sessionStorage and localStorage wrapper location
       */
      clearAll: function() {
        try {
          // Clear all sessionStorage caches
          const sessionKeys = Object.keys(sessionStorage);
          const spartanSessionKeys = sessionKeys.filter(k => k.startsWith('spartan_cup_'));
          spartanSessionKeys.forEach(k => sessionStorage.removeItem(k));

          // Clear localStorage wrapper location (iOS Safari fix cache)
          localStorage.removeItem('spartan_cup_wrapper_location');

          console.log(`🗑️ [Cache] Cleared ${spartanSessionKeys.length} session caches + wrapper location`);
        } catch (e) {
          console.error('[Cache] Error clearing all caches:', e);
        }
      }
    };

    // Cache configuration constants
    // TTL tuned based on data volatility:
    // - Stable data (fan feed, events) = longer cache (fewer API calls)
    // - Dynamic data (location, queue) = shorter cache (fresh data when needed)
    const CACHE_CONFIG = {
      LOCATION: { key: 'spartan_cup_location', ttl: 2 * 60 * 1000, label: 'Location' }, // 2 min - user might move between check-ins
      PROFILE: { key: 'spartan_cup_profile', ttl: 5 * 60 * 1000, label: 'Profile Data' }, // 5 min - points change with approvals
      FAN_FEED: { key: 'spartan_cup_fanfeed', ttl: 15 * 60 * 1000, label: 'Fan Feed' }, // 15 min - approved photos are stable
      EVENTS_LIST: { key: 'spartan_cup_events', ttl: 30 * 60 * 1000, label: 'Events List' }, // 30 min - admin edits rarely
      ADMIN_QUEUE: { key: 'spartan_cup_admin_queue', ttl: 30 * 1000, label: 'Admin Queue' } // 30 sec - very dynamic
    };

    /**
     * Check app version and clear caches if version has changed (cache busting on deployments)
     * Runs automatically on page load to ensure users get fresh data after updates
     */
    (function checkAppVersion() {
      try {
        const VERSION_KEY = 'spartan_cup_app_version';
        const storedVersion = localStorage.getItem(VERSION_KEY);
        const currentVersion = APP_DATA.appVersion;

        if (storedVersion !== currentVersion) {
          console.log(`🔄 [Version] App updated: ${storedVersion || 'unknown'} → ${currentVersion}`);
          console.log('🗑️ [Version] Clearing all caches due to version change...');

          // Clear all client-side caches
          CacheManager.clearAll();

          // Update stored version
          localStorage.setItem(VERSION_KEY, currentVersion);

          console.log('✅ [Version] Cache busting complete. Fresh data will be loaded.');
        } else {
          console.log(`✓ [Version] App version ${currentVersion} (up to date)`);
        }
      } catch (e) {
        console.error('[Version] Error checking app version:', e);
      }
    })();

    /**
     * Get cached location if it exists and hasn't expired
     * @return {Object|null} Location object {lat, lon, acc} or null
     */
    function getCachedLocation() {
      return CacheManager.get(CACHE_CONFIG.LOCATION.key, CACHE_CONFIG.LOCATION.ttl, CACHE_CONFIG.LOCATION.label);
    }

    /**
     * Cache the user's location for 2 minutes
     * Shorter TTL to ensure fresh location if user moves between check-in attempts
     * @param {Object} position - geolocation position object
     */
    function cacheLocation(position) {
      const locationData = {
        lat: position.coords.latitude,
        lon: position.coords.longitude,
        acc: position.coords.accuracy
      };
      CacheManager.set(CACHE_CONFIG.LOCATION.key, locationData, CACHE_CONFIG.LOCATION.label);
    }

    /**
     * Get cached profile data if it exists and hasn't expired
     * @return {Object|null} Profile data object or null
     */
    function getCachedProfileData() {
      return CacheManager.get(CACHE_CONFIG.PROFILE.key, CACHE_CONFIG.PROFILE.ttl, CACHE_CONFIG.PROFILE.label);
    }

    /**
     * Cache profile data for 5 minutes
     * @param {Object} profileData - Profile data from getProfileData()
     */
    function cacheProfileData(profileData) {
      CacheManager.set(CACHE_CONFIG.PROFILE.key, profileData, CACHE_CONFIG.PROFILE.label);
    }

    /**
     * Clear profile cache (called after submission approval or settings change)
     */
    function clearProfileCache() {
      CacheManager.clear(CACHE_CONFIG.PROFILE.key, CACHE_CONFIG.PROFILE.label);
    }

    /**
     * Get cached fan feed data if it exists and hasn't expired
     * @return {Object|null} Fan feed response object or null
     */
    function getCachedFanFeed() {
      return CacheManager.get(CACHE_CONFIG.FAN_FEED.key, CACHE_CONFIG.FAN_FEED.ttl, CACHE_CONFIG.FAN_FEED.label);
    }

    /**
     * Cache fan feed data for 15 minutes
     * Longer TTL safe since approved photos are stable (only grow, don't change)
     * @param {Object} feedData - Fan feed response from getFanFeedCached()
     */
    function cacheFanFeed(feedData) {
      CacheManager.set(CACHE_CONFIG.FAN_FEED.key, feedData, CACHE_CONFIG.FAN_FEED.label);
    }

    /**
     * Clear fan feed cache (called after new submission approval)
     */
    function clearFanFeedCache() {
      CacheManager.clear(CACHE_CONFIG.FAN_FEED.key, CACHE_CONFIG.FAN_FEED.label);
    }

    /**
     * Get cached events list if it exists and hasn't expired
     * @return {Array|null} Events array or null
     */
    function getCachedEventsList() {
      return CacheManager.get(CACHE_CONFIG.EVENTS_LIST.key, CACHE_CONFIG.EVENTS_LIST.ttl, CACHE_CONFIG.EVENTS_LIST.label);
    }

    /**
     * Cache events list for 30 minutes
     * Longer TTL safe since admin edits events rarely
     * @param {Array} eventsData - Events list from getEventsList()
     */
    function cacheEventsList(eventsData) {
      CacheManager.set(CACHE_CONFIG.EVENTS_LIST.key, eventsData, CACHE_CONFIG.EVENTS_LIST.label);
    }

    /**
     * Clear events list cache (called when admin edits events)
     */
    function clearEventsListCache() {
      CacheManager.clear(CACHE_CONFIG.EVENTS_LIST.key, CACHE_CONFIG.EVENTS_LIST.label);
    }

    /**
     * Get cached admin queue if it exists and hasn't expired
     * @return {Object|null} Admin queue response or null
     */
    function getCachedAdminQueue() {
      return CacheManager.get(CACHE_CONFIG.ADMIN_QUEUE.key, CACHE_CONFIG.ADMIN_QUEUE.ttl, CACHE_CONFIG.ADMIN_QUEUE.label);
    }

    /**
     * Cache admin queue for 30 seconds (shorter TTL due to dynamic nature)
     * @param {Object} queueData - Admin queue from getAdminQueue()
     */
    function cacheAdminQueue(queueData) {
      CacheManager.set(CACHE_CONFIG.ADMIN_QUEUE.key, queueData, CACHE_CONFIG.ADMIN_QUEUE.label);
    }

    /**
     * Clear admin queue cache (called after approving/rejecting submissions)
     */
    function clearAdminQueueCache() {
      CacheManager.clear(CACHE_CONFIG.ADMIN_QUEUE.key, CACHE_CONFIG.ADMIN_QUEUE.label);
    }

    /**
     * Wrapper for google.script.run with automatic retry on rate limit errors (429).
     * Implements exponential backoff: 1s, 2s, 4s delays between retries.
     * @param {string} functionName - Name of the backend function to call (e.g., 'getProfileData')
     * @param {Array} args - Arguments to pass to the function
     * @param {Function} onSuccess - Success callback
     * @param {Function} onFailure - Failure callback (optional)
     * @param {number} attempt - Current attempt number (used internally for recursion)
     * @example
     * // Usage example:
     * callWithRetry('getProfileData', [], function(data) { console.log(data); }, function(error) { console.error(error); });
     */
    function callWithRetry(functionName, args, onSuccess, onFailure, attempt = 1) {
      const MAX_RETRIES = 3;
      const BASE_DELAY = 1000; // 1 second

      const runner = google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(function(error) {
          // Check if it's a rate limit error and we haven't exceeded max retries
          // Use specific checks to avoid false positives from random strings containing '429'
          const errorMsg = error && error.message ? error.message.toLowerCase() : '';
          const errorStr = error ? error.toString().toLowerCase() : '';
          const isRateLimitError = error && (
            // Check for HTTP 429 status in various formats
            /\b(http\s*)?429\b/.test(errorMsg) ||
            /\b(http\s*)?429\b/.test(errorStr) ||
            // Check for Google-specific quota error messages
            errorMsg.includes('service invoked too many times') ||
            errorMsg.includes('rate limit') ||
            errorMsg.includes('quota exceeded') ||
            errorMsg.includes('too many requests')
          );

          if (isRateLimitError && attempt < MAX_RETRIES) {
            // Calculate delay with exponential backoff
            const delay = BASE_DELAY * Math.pow(2, attempt - 1);
            console.warn(`[Retry ${attempt}/${MAX_RETRIES}] Rate limit hit, retrying in ${delay}ms...`);

            // Retry after delay
            setTimeout(function() {
              callWithRetry(functionName, args, onSuccess, onFailure, attempt + 1);
            }, delay);
          } else {
            // Either not a rate limit error, or we've exhausted retries
            if (isRateLimitError) {
              console.error('[Retry Failed] Exceeded max retries for rate limit error');
            }
            // Call the failure handler if provided
            if (onFailure) {
              onFailure(error);
            }
          }
        });

      // Call the function dynamically using bracket notation
      runner[functionName](...args);
    }

    // --- HAPTIC FEEDBACK (Mobile Optimization) ------------------

    /**
     * Trigger haptic feedback on supported devices
     * @param {string} type - 'light', 'medium', 'heavy', 'error', or 'success'
     */
    function hapticFeedback(type = 'medium') {
      if (!navigator.vibrate) return; // Not supported

      const patterns = {
        'light': 10,
        'medium': 20,
        'heavy': 50,
        'error': [50, 30, 50], // Double vibration for errors
        'success': [10, 20, 30] // Ascending vibration for success
      };

      const pattern = patterns[type] || patterns.medium;
      navigator.vibrate(pattern);
    }

    // --- TOAST NOTIFICATIONS -------------------------------------

    /**
     * Show a toast notification (non-blocking, better than alert())
     * @param {string} message - Message to display
     * @param {string} type - 'success', 'error', 'warning', or 'info'
     * @param {number} duration - Duration in milliseconds (default: 3000)
     */
    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toast-container');
      if (!container) {
        console.warn('Toast container not found, falling back to console.log');
        console.log(`[${type.toUpperCase()}] ${message}`);
        return;
      }

      // Limit maximum visible toasts to prevent overlap and clutter
      const MAX_TOASTS = 3;
      const existingToasts = container.querySelectorAll('.toast');
      if (existingToasts.length >= MAX_TOASTS) {
        // Remove the oldest toast (first in the list)
        existingToasts[0].remove();
      }

      // Create toast element
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;

      // Add to container
      container.appendChild(toast);

      // Trigger show animation
      setTimeout(() => {
        toast.classList.add('show');
      }, 10);

      // Auto-hide after duration
      setTimeout(() => {
        toast.classList.remove('show');

        // Use transitionend event to remove element after animation completes
        // This is more robust than hardcoded timeout and respects actual CSS transition duration
        const handleTransitionEnd = (e) => {
          // Only remove on opacity transition (not transform)
          if (e.propertyName === 'opacity') {
            toast.removeEventListener('transitionend', handleTransitionEnd);
            if (toast.parentNode === container) {
              container.removeChild(toast);
            }
          }
        };

        toast.addEventListener('transitionend', handleTransitionEnd);

        // Fallback timeout in case transitionend doesn't fire (should never happen)
        setTimeout(() => {
          toast.removeEventListener('transitionend', handleTransitionEnd);
          if (toast.parentNode === container) {
            container.removeChild(toast);
          }
        }, 500);
      }, duration);
    }

    // --- OFFLINE/ONLINE DETECTION --------------------------------

    /**
     * Setup offline/online detection and show banner when offline
     */
    function setupOfflineDetection() {
      const banner = document.getElementById('offline-banner');
      if (!banner) return;

      // Listen for offline/online events
      window.addEventListener('offline', () => {
        banner.classList.add('show');
        showToast('Connection lost. Some features may not work.', 'warning', 5000);
      });

      window.addEventListener('online', () => {
        banner.classList.remove('show');
        showToast('Connection restored!', 'success', 2000);
      });

      // Check initial state
      if (!navigator.onLine) {
        banner.classList.add('show');
      }
    }

    // --- PULL-TO-REFRESH -----------------------------------------

    /**
     * Pull-to-refresh gesture detection and handling
     * Detects downward swipe at top of page and triggers page refresh
     */
    let pullStartY = 0;
    let pullCurrentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 80; // Pixels to trigger refresh
    const MAX_PULL_DISTANCE = 120; // Max visual feedback distance

    /**
     * Initialize pull-to-refresh on supported pages
     */
    function setupPullToRefresh() {
      const indicator = document.getElementById('pull-indicator');
      const pullText = document.getElementById('pull-text');
      if (!indicator || !pullText) return;

      // Only enable on profile, history, and admin pages
      const enabledPages = ['profile', 'history', 'admin'];
      if (!enabledPages.includes(APP_DATA.page)) {
        return;
      }

      // Touch start - detect if at top of page
      document.addEventListener('touchstart', (e) => {
        // Only activate if scrolled to top
        if (window.scrollY === 0 && !isPulling) {
          pullStartY = e.touches[0].clientY;
          isPulling = true;
        }
      }, { passive: true });

      // Touch move - track pull distance and show indicator
      document.addEventListener('touchmove', (e) => {
        if (!isPulling || pullStartY === 0) return;

        pullCurrentY = e.touches[0].clientY;
        const pullDistance = Math.min(pullCurrentY - pullStartY, MAX_PULL_DISTANCE);

        if (pullDistance > 0) {
          // Update indicator position and text
          const progress = Math.min(pullDistance / PULL_THRESHOLD, 1);
          const indicatorTop = Math.min(pullDistance - 80, 0); // Start at -80, move to 0

          indicator.style.transform = `translateX(-50%) translateY(${indicatorTop}px)`;
          indicator.classList.remove('hidden');

          // Update text based on threshold
          if (pullDistance >= PULL_THRESHOLD) {
            pullText.textContent = 'Release to refresh';
            indicator.style.background = 'rgba(181, 18, 27, 0.95)'; // Secondary color when ready
          } else {
            pullText.textContent = 'Pull to refresh';
            indicator.style.background = 'rgba(27, 59, 135, 0.95)'; // Primary color
          }

          // Rotate spinner based on pull distance
          const spinner = indicator.querySelector('.pull-spinner');
          if (spinner) {
            spinner.style.transform = `rotate(${pullDistance * 3}deg)`;
          }
        }
      }, { passive: true });

      // Touch end - trigger refresh if threshold met
      document.addEventListener('touchend', () => {
        if (!isPulling) return;

        const pullDistance = pullCurrentY - pullStartY;

        if (pullDistance >= PULL_THRESHOLD) {
          // Trigger refresh!
          triggerPageRefresh(indicator, pullText);
        } else {
          // Reset indicator
          resetPullIndicator(indicator);
        }

        // Reset state
        pullStartY = 0;
        pullCurrentY = 0;
        isPulling = false;
      });

      // Touch cancel - reset state
      document.addEventListener('touchcancel', () => {
        resetPullIndicator(indicator);
        pullStartY = 0;
        pullCurrentY = 0;
        isPulling = false;
      });
    }

    /**
     * Reset pull indicator to hidden state
     */
    function resetPullIndicator(indicator) {
      indicator.style.transform = 'translateX(-50%) translateY(-80px)';
      indicator.style.background = 'rgba(27, 59, 135, 0.95)';
      setTimeout(() => {
        indicator.classList.add('hidden');
      }, 300); // Wait for transition
    }

    /**
     * Trigger page-specific data refresh
     */
    function triggerPageRefresh(indicator, pullText) {
      // Show refreshing state
      indicator.classList.add('refreshing');
      indicator.style.transform = 'translateX(-50%) translateY(0px)';
      pullText.textContent = 'Refreshing...';
      hapticFeedback('medium');

      const spinner = indicator.querySelector('.pull-spinner');
      if (spinner) {
        spinner.style.transform = 'rotate(0deg)';
      }

      // Call page-specific refresh handler
      refreshCurrentPage()
        .then(() => {
          // Success!
          pullText.textContent = 'Updated!';
          hapticFeedback('success');

          // Hide after short delay
          setTimeout(() => {
            indicator.classList.remove('refreshing');
            resetPullIndicator(indicator);
          }, 800);
        })
        .catch((error) => {
          console.error('Refresh failed:', error);
          pullText.textContent = 'Refresh failed';
          showToast('Failed to refresh. Please try again.', 'error');

          // Hide after short delay
          setTimeout(() => {
            indicator.classList.remove('refreshing');
            resetPullIndicator(indicator);
          }, 1500);
        });
    }

    /**
     * Refresh current page data based on APP_DATA.page
     * @return {Promise} Resolves when refresh completes
     */
    function refreshCurrentPage() {
      return new Promise((resolve, reject) => {
        switch(APP_DATA.page) {
          case 'profile':
            // Refresh profile data
            callWithRetry('getProfileData', [],
              (data) => {
                // Success handler
                if (data && !data.error) {
                  cacheProfileData(data);
                  populateProfile(data);
                  resolve();
                } else {
                  reject(data?.error || 'Unknown error');
                }
              },
              (error) => {
                // Failure handler - prevents UI hang on network/server errors
                console.error('[Refresh] Profile data fetch failed:', error);
                reject(error.message || 'Failed to refresh profile data');
              }
            );
            break;

          case 'history':
            // Refresh history data (history is part of profile data)
            callWithRetry('getProfileData', [],
              (data) => {
                // Success handler
                if (data && !data.error) {
                  cacheProfileData(data); // Cache the refreshed data
                  populateHistory(data);
                  resolve();
                } else {
                  reject(data?.error || 'Unknown error');
                }
              },
              (error) => {
                // Failure handler - prevents UI hang on network/server errors
                console.error('[Refresh] History data fetch failed:', error);
                reject(error.message || 'Failed to refresh history data');
              }
            );
            break;

          case 'admin':
            // Refresh admin pending submissions
            if (typeof refreshPendingSubmissions === 'function') {
              refreshPendingSubmissions();
              resolve();
            } else {
              // Fallback: reload page
              setTimeout(() => {
                window.top.location.reload();
              }, 100);
              resolve();
            }
            break;

          default:
            reject('Refresh not supported on this page');
        }
      });
    }

    /**
     * Check current permission status (iOS may not support this)
     * @return {Promise<string>} 'granted', 'denied', 'prompt', or 'unknown'
     */
    async function checkLocationPermission() {
      try {
        if (!navigator.permissions) {
          return 'unknown'; // Permissions API not supported
        }
        const result = await navigator.permissions.query({ name: 'geolocation' });
        return result.state;
      } catch (e) {
        console.error('Error checking permission:', e);
        return 'unknown';
      }
    }

    /**
     * Test if geolocation actually works (for iOS Safari where Permissions API doesn't work)
     * This actively tries to get location to verify it's enabled
     * @param {Function} onGranted - Callback when location is available
     * @param {Function} onDenied - Callback when location is denied/unavailable
     */
    function testLocationAccess(onGranted, onDenied) {
      if (!navigator.geolocation) {
        console.error('Geolocation not supported');
        onDenied('not_supported');
        return;
      }

      // Detect iOS Safari iframe issue
      const isInIframe = window.self !== window.top;
      const isIOSSafari = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      // console.log('Testing geolocation:', {
      //   isInIframe: isInIframe,
      //   isIOSSafari: isIOSSafari,
      //   userAgent: navigator.userAgent
      // });

      // Try to get location with short timeout - just testing permission
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // Success - permission is granted and working
          // console.log('Geolocation success:', position.coords);
          cacheLocation(position); // Cache it while we're at it
          onGranted({
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy
          });
        },
        (error) => {
          // Failed - determine why
          console.error('Geolocation error:', {
            code: error.code,
            message: error.message,
            PERMISSION_DENIED: error.PERMISSION_DENIED,
            POSITION_UNAVAILABLE: error.POSITION_UNAVAILABLE,
            TIMEOUT: error.TIMEOUT
          });

          if (error.code === error.PERMISSION_DENIED) {
            // On iOS Safari in iframe, this might be a security restriction
            if (isIOSSafari && isInIframe) {
              onDenied('ios_iframe_blocked');
            } else {
              onDenied('denied');
            }
          } else if (error.code === error.TIMEOUT) {
            onDenied('timeout');
          } else {
            onDenied('unavailable');
          }
        },
        {
          enableHighAccuracy: false, // Use low accuracy for faster test
          timeout: 5000, // 5 second timeout for test
          maximumAge: 300000 // Allow 5-minute cached position for this test
        }
      );
    }

    /**
     * Validate that location coordinates are reasonable (sanity check)
     * @param {Object} location - Location object {lat, lon, acc}
     * @return {boolean} True if location values are valid
     */
    function isValidLocation(location) {
      if (!location || typeof location.lat !== 'number' || typeof location.lon !== 'number') {
        return false;
      }
      // Check latitude is between -90 and 90
      if (location.lat < -90 || location.lat > 90) {
        console.warn('[Location] Invalid latitude:', location.lat);
        return false;
      }
      // Check longitude is between -180 and 180
      if (location.lon < -180 || location.lon > 180) {
        console.warn('[Location] Invalid longitude:', location.lon);
        return false;
      }
      // Check accuracy is reasonable (>0 and <50km)
      if (!location.acc || location.acc < 0 || location.acc > 50000) {
        console.warn('[Location] Invalid accuracy:', location.acc);
        return false;
      }
      return true;
    }

    /**
     * Request user location with caching and proper error handling
     * NOW checks if location was passed from Firebase wrapper first
     * @param {Function} onSuccess - Callback with location {lat, lon, acc}
     * @param {Function} onError - Callback with error message
     * @param {boolean} forceRefresh - Skip cache and request fresh location
     */
    function requestLocation(onSuccess, onError, forceRefresh = false) {
      // PRIORITY 1: Check localStorage for location from Firebase wrapper (NEW - iOS Safari fix)
      // This fixes iOS Safari by avoiding URL parameter redirects that break google.script.run
      if (!forceRefresh) {
        try {
          const wrapperData = localStorage.getItem('spartan_cup_wrapper_location');
          if (wrapperData) {
            const parsed = JSON.parse(wrapperData);
            const age = Date.now() - parsed.timestamp;
            const MAX_AGE = 15 * 60 * 1000; // 15 minutes (extended for user convenience)

            if (age < MAX_AGE) {
              console.log('[Location] Using location from Firebase wrapper localStorage (age: ' + Math.round(age/1000) + 's)');
              const wrapperLocation = {
                lat: parseFloat(parsed.lat),
                lon: parseFloat(parsed.lon),
                acc: parseFloat(parsed.acc)
              };

              if (isValidLocation(wrapperLocation)) {
                // Also cache in sessionStorage for faster subsequent access
                // Convert to geolocation Position format for cacheLocation()
                const positionObject = {
                  coords: {
                    latitude: wrapperLocation.lat,
                    longitude: wrapperLocation.lon,
                    accuracy: wrapperLocation.acc
                  }
                };
                cacheLocation(positionObject);
                onSuccess(wrapperLocation);
                return;
              } else {
                console.warn('[Location] Invalid wrapper location, clearing localStorage');
                localStorage.removeItem('spartan_cup_wrapper_location');
              }
            } else {
              console.log('[Location] Wrapper location expired (age: ' + Math.round(age/1000) + 's), clearing');
              localStorage.removeItem('spartan_cup_wrapper_location');
            }
          }
        } catch (e) {
          console.error('[Location] Error reading wrapper location from localStorage:', e);
        }
      }

      // PRIORITY 2: Check if location was passed from URL params (DEPRECATED - backwards compatibility)
      // This allows iOS Safari to work by capturing location BEFORE entering the GAS iframe
      if (!forceRefresh && APP_DATA.userLat !== null && APP_DATA.userLon !== null) {
        // console.log('[Location] Using location from Firebase wrapper');
        const wrapperLocation = {
          lat: parseFloat(APP_DATA.userLat),
          lon: parseFloat(APP_DATA.userLon),
          acc: parseFloat(APP_DATA.userAcc)
        };
        // Validate location values are reasonable (sanity check)
        if (isValidLocation(wrapperLocation)) {
          onSuccess(wrapperLocation);
          return;
        } else {
          console.warn('[Location] Wrapper provided invalid location values, falling back to cache');
        }
      }

      // PRIORITY 3: Try to use cached location (unless forced refresh)
      if (!forceRefresh) {
        const cached = getCachedLocation();
        if (cached) {
          // console.log('[Location] Using cached location');
          onSuccess(cached);
          return;
        }
      }

      if (!navigator.geolocation) {
        onError('Geolocation is not supported by your browser');
        return;
      }

      // PRIORITY 4: Request fresh location from browser
      // console.log('[Location] Requesting fresh location from browser');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // console.log('[Location] Got fresh location from browser');
          cacheLocation(position);
          onSuccess({
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy
          });
        },
        (error) => {
          let message = 'Unable to get your location.';

          if (error.code === error.PERMISSION_DENIED) {
            message = 'Location permission denied. Please enable location in Settings > Safari > Spartan Cup (iOS) or browser settings.';
          } else if (error.code === error.TIMEOUT) {
            message = 'Location request timed out. Please try again.';
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = 'Your location is unavailable. Please check GPS.';
          }

          console.error('[Location] Error:', message);
          onError(message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0 // Don't use browser cache; let our session cache handle it
        }
      );
    }

    /**
     * Main function to navigate between pages using URL parameters
     * @param {string} pageName - The ID of the page to show (e.g., 'profile')
     */
    function navigateToPage(pageName) {
      if (pageName) {
        // Show loading spinner immediately for better UX
        const loadingModal = document.getElementById('loading-modal');
        if(loadingModal) loadingModal.classList.remove('hidden');

        // Add a small delay so the loading modal is visible before the page reloads
        // This ensures the user sees visual feedback that their click registered
        setTimeout(() => {
          // PRESERVE LOCATION PARAMS: Extract from current URL or APP_DATA
          let lat = APP_DATA.userLat;
          let lon = APP_DATA.userLon;
          let acc = APP_DATA.userAcc;

          // If not in APP_DATA, try to extract from current URL
          if (!lat || !lon) {
            const urlParams = new URLSearchParams(window.location.search);
            lat = urlParams.get('lat') || lat;
            lon = urlParams.get('lon') || lon;
            acc = urlParams.get('acc') || acc;
          }

          // Build URL with location params preserved
          let url = APP_DATA.appUrl + '?page=' + pageName;
          if (lat && lon) {
            url += '&lat=' + lat + '&lon=' + lon;
            if (acc) {
              url += '&acc=' + acc;
            }
          }

          // Use anchor element to avoid Caja sanitizer issues with window.top.location
          const link = document.createElement('a');
          link.href = url;
          link.target = '_top';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }, 250);  // 250ms delay gives a clear visual indication
      }
    }

    /** Load and display events sorted by distance for selection */
    function loadEventsByDistance() {
      const loadingState = document.getElementById('loading-state');
      const eventsList = document.getElementById('events-list');
      const errorState = document.getElementById('error-state');
      const noEventsState = document.getElementById('no-events-state');
      const loadButton = document.getElementById('load-events-button');

      // Show loading state and hide button
      loadingState.classList.remove('hidden');
      if (loadButton) loadButton.classList.add('hidden');

      // Request user location (force fresh to prevent stale cache when user moves)
      requestLocation(
        (location) => {
          // Success: Fetch active events sorted by distance
          google.script.run.withSuccessHandler((events) => {
            loadingState.classList.add('hidden');

            if (!events || events.length === 0) {
              noEventsState.classList.remove('hidden');
              return;
            }

            // Display events
            eventsList.innerHTML = '';
            events.forEach((event, index) => {
              const isClosest = index === 0;
              const card = document.createElement('div');
              card.className = `event-card p-4 rounded-lg border cursor-pointer transition-all hover:shadow-lg ${
                isClosest
                  ? 'event-card-closest'
                  : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800'
              }`;
              card.innerHTML = `
                <div class="flex items-start justify-between">
                  <div class="flex-1">
                    <h3 class="font-bold text-[#111318] dark:text-white">${event.eventName}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">📍 ${event.locationName}</p>
                    <p class="text-sm text-primary dark:text-blue-300 font-semibold mt-2">Code: ${event.eventCode}</p>
                  </div>
                  <div class="text-right">
                    <div class="text-lg font-bold text-gray-700 dark:text-gray-300">${event.distance}m</div>
                    ${isClosest ? '<div class="text-xs text-primary dark:text-blue-300 font-bold mt-1">Closest</div>' : ''}
                  </div>
                </div>
              `;
              card.addEventListener('click', () => selectEvent(event.eventCode));
              eventsList.appendChild(card);
            });

            eventsList.classList.remove('hidden');
          }).withFailureHandler((error) => {
            console.error('Error loading events:', error);
            loadingState.classList.add('hidden');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = 'Error loading events: ' + error.message;
            errorState.classList.remove('hidden');
          }).getEventsByDistance(location.lat, location.lon);

        (errorMessage) => {

          loadingState.classList.add('hidden');
          const errorElement = document.getElementById('error-message');
          errorElement.textContent = errorMessage;
          errorState.classList.remove('hidden');
          console.error('Geolocation error:', errorMessage);
        },
        true // Force fresh location (don't use cache)
      );
    }

      const isFirstPlace = item.rank === 1;

      const backgroundClass = getLeaderboardRowClasses(item.isCurrentUser, isFirstPlace);
      const rankClass = getRankClasses(isFirstPlace);
      const pointsClass = getPointsClasses(isFirstPlace);

      // Build name with optional "(You)" label - using DOM creation to avoid XSS
      const nameDiv = document.createElement('div');
      const nameSpan = document.createElement('span');
      nameSpan.className = `flex-1 truncate font-medium text-[#111318] dark:text-white ${item.isCurrentUser ? 'font-semibold' : ''}`;
      nameSpan.textContent = item.name;

      if (item.isCurrentUser) {
        const youLabel = document.createElement('span');
        youLabel.className = 'text-primary dark:text-blue-300 text-sm';
        youLabel.textContent = ' (You)';
        nameSpan.appendChild(youLabel);
      }

      // Get the safely constructed HTML
      nameDiv.appendChild(nameSpan);
      const safeNameHTML = nameDiv.innerHTML;

      return `
        <div class="flex items-center gap-3 rounded-lg p-3 ${backgroundClass}" ${item.isCurrentUser ? 'aria-current="true"' : ''}>
          <span class="font-bold text-lg ${rankClass} w-5 text-center">${item.rank}</span>
          <span class="material-symbols-outlined text-2xl ${item.color}">${item.icon}</span>
          ${safeNameHTML}
          <span class="font-bold ${pointsClass}">${item.points} PTS</span>
        </div>`;
    }

      const htmlContent = leaderboard.map(item => {

    /**
     * Update the "last updated" timestamp on the leaderboard
     * Shows relative time from when profile data was cached
     */
    function updateLeaderboardTimestamp() {
      const timestampEl = document.getElementById('leaderboard-timestamp');
      if (!timestampEl) return;

      // Check cache age
      const cached = sessionStorage.getItem(CACHE_CONFIG.PROFILE.key);
      if (!cached) {
        timestampEl.textContent = 'Just now';
        return;
      }

      try {
        const data = JSON.parse(cached);

        // Validate timestamp exists and is a valid number
        if (!data || typeof data.timestamp !== 'number' || isNaN(data.timestamp)) {
          timestampEl.textContent = '';
          return;
        }

        const now = Date.now();
        const age = now - data.timestamp;

        // Validate age is reasonable (not negative, not impossibly large)
        if (age < 0 || age > 24 * 60 * 60 * 1000) { // Max 24 hours
          timestampEl.textContent = '';
          return;
        }

        const minutes = Math.floor(age / 60000);

        if (minutes === 0) {
          timestampEl.textContent = 'Just now';
        } else if (minutes === 1) {
          timestampEl.textContent = '1m ago';
        } else if (minutes < 60) {
          timestampEl.textContent = `${minutes}m ago`;
        } else {
          const hours = Math.floor(minutes / 60);
          timestampEl.textContent = hours === 1 ? '1h ago' : `${hours}h ago`;
        }
      } catch (e) {
        timestampEl.textContent = '';
      }
    }

    /**
     * Check if wrapper location is expired or expiring soon and show notification
     * Proactively informs user before submission fails due to stale location
     * Called on submit page load
     */
    function checkLocationExpiry() {
      try {
        const wrapperData = localStorage.getItem('spartan_cup_wrapper_location');
        if (!wrapperData) return; // No wrapper location, skip check

        const parsed = JSON.parse(wrapperData);
        const age = Date.now() - parsed.timestamp;
        const MAX_AGE = 15 * 60 * 1000; // 15 minutes
        const timeRemaining = MAX_AGE - age;

        // If expired or expiring within 2 minutes
        if (timeRemaining <= 2 * 60 * 1000) {
          const statusDiv = document.getElementById('location-notice');
          if (statusDiv) {
            const isExpired = timeRemaining <= 0;
            statusDiv.className = `mb-4 p-3 rounded-lg ${
              isExpired
                ? 'bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800'
                : 'bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-800'
            }`;

            statusDiv.innerHTML = `
              <p class="text-sm ${isExpired ? 'text-red-900 dark:text-red-100' : 'text-yellow-900 dark:text-yellow-100'}">
                <span class="font-semibold">📍 ${isExpired ? 'Location Expired' : 'Location Expiring Soon'}</span>
              </p>
              <p class="text-xs ${isExpired ? 'text-red-800 dark:text-red-200' : 'text-yellow-800 dark:text-yellow-200'} mt-1">
                ${isExpired
                  ? 'Your location data has expired. Please refresh to continue.'
                  : `Location expires in ${Math.ceil(timeRemaining / 60000)} minute${Math.ceil(timeRemaining / 60000) === 1 ? '' : 's'}. Refresh for best accuracy.`
                }
              </p>
              <button onclick="refreshLocation()" class="mt-2 w-full text-sm ${
                isExpired ? 'bg-red-600 hover:bg-red-700' : 'bg-yellow-600 hover:bg-yellow-700'
              } text-white px-4 py-2 rounded font-semibold transition-colors">
                🔄 Refresh Location
              </button>
            `;
          }
        }
      } catch (e) {
        console.error('[Location] Error checking expiry:', e);
      }
    }

    /**
     * Redirect user to Firebase wrapper to refresh location data
     * Used when location has expired or is about to expire
     * This is a global function so onclick handlers can call it
     */
    function refreshLocation() {
      console.log('[Location] User requested location refresh');
      const link = document.createElement('a');
      link.href = APP_DATA.firebaseWrapperUrl;
      link.target = '_top';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /**
     * Update the location permission status UI on submit page
     * This is a global function so onclick handlers can call it
     */
    function updateLocationStatus() {
      const statusDiv = document.getElementById('location-notice');
      if (!statusDiv) return;

      // Show checking state
      statusDiv.className = 'mb-4 p-3 rounded-lg bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700';
      statusDiv.innerHTML = '<p class="text-sm text-gray-600 dark:text-gray-300">🔄 Checking location status...</p>';

      // Test if location actually works
      testLocationAccess(
        (location) => {
          // Success - location is enabled and working!
          statusDiv.className = 'mb-4 p-3 rounded-lg bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800';
          statusDiv.innerHTML = `
            <p class="text-sm text-green-900 dark:text-green-100">
              <span class="font-semibold">✅ Location Enabled</span> - Ready to submit!
            </p>
            <p class="text-xs text-green-800 dark:text-green-200 mt-1">
              Accuracy: ${Math.round(location.acc)}m
            </p>
          `;
        },
        (errorType) => {
          // Failed - show appropriate error message
          statusDiv.className = 'mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800';

          let message = '';
          if (errorType === 'ios_iframe_blocked') {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">❌ iOS Safari Not Supported</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-2">
                <strong>Safari blocks location in this app.</strong> This is an Apple security restriction that cannot be fixed, even with Settings enabled.
              </p>
              <div class="mt-3 p-3 bg-blue-50 dark:bg-blue-900/40 rounded-lg border-2 border-blue-500 dark:border-blue-400">
                <p class="text-sm font-bold text-blue-900 dark:text-blue-100 mb-2">✅ REQUIRED: Use Chrome on iPhone</p>
                <p class="text-xs text-blue-900 dark:text-blue-100 mb-2">
                  <strong>1.</strong> Install "Chrome" from the App Store (free)<br>
                  <strong>2.</strong> Open this link in Chrome<br>
                  <strong>3.</strong> Location will work immediately
                </p>
                <p class="text-xs text-blue-700 dark:text-blue-200 italic">
                  Chrome doesn't have Safari's iframe restrictions and works perfectly with this app.
                </p>
              </div>
              <a href="https://apps.apple.com/us/app/google-chrome/id535886823" target="_blank" class="mt-3 w-full text-sm bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold block text-center">
                📱 Download Chrome from App Store
              </a>
            `;
          } else if (errorType === 'denied') {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">❌ Location Permission Denied</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-2">
                <strong>iOS Safari:</strong> Settings → Safari → Location Services → While Using → Find "script.google.com" or refresh this page to see the permission prompt<br>
                <strong>Chrome:</strong> Click the location icon in the address bar and select "Allow"
              </p>
              <button class="location-recheck-btn mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                Recheck Permission
              </button>
            `;
          } else if (errorType === 'timeout') {
            message = `
              <p class="text-sm text-yellow-900 dark:text-yellow-100">
                <span class="font-semibold">⏱️ Location Timeout</span> - GPS signal weak
              </p>
              <p class="text-xs text-yellow-800 dark:text-yellow-200 mt-1">
                Try moving outdoors or near a window, then click recheck.
              </p>
              <button class="location-recheck-btn mt-2 text-xs bg-yellow-600 text-white px-3 py-1 rounded hover:bg-yellow-700">
                Recheck Location
              </button>
            `;
            statusDiv.className = 'mb-4 p-3 rounded-lg bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-800';
          } else {
            message = `
              <p class="text-sm text-red-900 dark:text-red-100">
                <span class="font-semibold">📍 Location Unavailable</span>
              </p>
              <p class="text-xs text-red-800 dark:text-red-200 mt-1">
                Check that Location Services are enabled in your device settings.
              </p>
              <button class="location-recheck-btn mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                Recheck Location
              </button>
            `;
          }

          statusDiv.innerHTML = message;

          // Add event listener to recheck button (if it exists)
          const recheckBtn = statusDiv.querySelector('.location-recheck-btn');
          if (recheckBtn) {
            recheckBtn.addEventListener('click', updateLocationStatus);
          }
        }
      );
    }

    // --- FORM SUBMISSION ---
    let pendingFormData = null;
    let pendingPhotoBlob = null;
    
    function handleFormSubmit(e) {
      e.preventDefault();
      document.getElementById('loading-modal').classList.remove('hidden');

      const photoFile = document.getElementById('photo-input').files[0];
      if (!photoFile) {
        showToast('Please select a photo!', 'error');
        hapticFeedback('error');
        document.getElementById('loading-modal').classList.add('hidden');
        return;
      }

      const formData = {
        eventId: new URLSearchParams(window.location.search).get('event'),
        eventCode: document.getElementById('event-code-input')?.value || '',
        theme: document.getElementById('theme-check').checked,
        notes: document.getElementById('notes').value,
        location: null
      };

      // Request location (will use cache if available within 5 minutes)
      requestLocation(
        (location) => {
          // Success: Location obtained
          formData.location = location;

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // OPTIMIZED PHOTO COMPRESSION
              // Calculate optimal dimensions while maintaining aspect ratio
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const MAX_HEIGHT = 600;
              let width = img.width;
              let height = img.height;

              // Maintain aspect ratio
              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d', { alpha: false }); // Disable alpha channel for smaller size

              // Use higher quality rendering
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, width, height);

              // Adaptive quality: use lower quality for smaller dimensions to reduce file size
              let quality = 0.75; // Default 75% quality
              if (width <= 400 || height <= 300) {
                quality = 0.65; // Smaller images: lower quality (65%)
              } else if (width <= 600 && height <= 450) {
                quality = 0.70; // Medium images: 70%
              }

              // Encode as progressive JPEG for faster perceived loading
              const dataUrl = canvas.toDataURL('image/jpeg', quality);

              const photoBlob = dataUrl;
              pendingFormData = formData;
              pendingPhotoBlob = photoBlob;

              google.script.run
                .withSuccessHandler(handleSubmissionResponse)
                .withFailureHandler(handleFailure)
                .submitEvent(formData, photoBlob);
            }
            img.src = e.target.result;
          };
          reader.readAsDataURL(photoFile);
        },
        (errorMessage) => {
          // Error: Location not available
          console.error('Geolocation error:', errorMessage);
          document.getElementById('loading-modal').classList.add('hidden');
          showToast(`Location Required: ${errorMessage}. Please enable location in your browser settings.`, 'error', 5000);
          hapticFeedback('error');
        },
        true // Force fresh location for accurate geofence validation
      );
    }

    function handleSubmissionResponse(response) {
      if (response.status === "success") {
        // Clear caches so user sees updated data immediately
        clearProfileCache(); // Points and history updated
        clearFanFeedCache(); // New badge award appears in fan feed

        // Clear wrapper location from localStorage after successful submission
        // This ensures fresh location is obtained for next submission (prevents stale location reuse)
        localStorage.removeItem('spartan_cup_wrapper_location');
        console.log('[Location] Cleared wrapper location after successful submission');

        // Haptic feedback for success
        hapticFeedback('success');

        // Show success message in styled modal (not alert, which breaks user activation)
        document.getElementById('loading-modal').classList.add('hidden');
        document.getElementById('success-message').innerText = response.message;
        document.getElementById('success-modal').classList.remove('hidden');
        // Navigation happens when user clicks "Continue" button (preserves user activation)

      } else if (response.status === "pending_conflict") {
        document.getElementById('loading-modal').classList.add('hidden');
        document.getElementById('modal-message').innerText = response.message;
        document.getElementById('confirm-modal').classList.remove('hidden');
        hapticFeedback('medium');
        // pendingFormData and pendingPhotoBlob are already set

      } else if (response.status === "error") {
        document.getElementById('loading-modal').classList.add('hidden');
        showToast(response.message, 'error', 4000);
        hapticFeedback('error');
      }
    }

    function handleFailure(error) {
      document.getElementById('loading-modal').classList.add('hidden');
      showToast('A critical error occurred: ' + error.message, 'error', 5000);
      hapticFeedback('error');
    }
  </script>
