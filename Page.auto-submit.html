<!--
  Auto-Submit Page: Automatically detects closest active event
  based on user's geolocation and redirects to submission form.
-->
<div class="page">
  <div class="flex flex-col items-center justify-center min-h-screen p-4">
    <!-- Loading State -->
    <div id="auto-submit-loading" class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-primary mx-auto mb-4"></div>
      <h2 class="text-xl font-bold text-[#111318] dark:text-white mb-2">Detecting Nearby Events...</h2>
      <p class="text-gray-600 dark:text-gray-400">Please wait while we find events near you.</p>
    </div>
  </div>
</div>

<!-- No Event Found Modal -->
<div id="no-event-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
  <div class="bg-background-light dark:bg-gray-800 p-6 rounded-lg shadow-xl max-w-sm w-full">
    <div class="flex items-center justify-center w-16 h-16 mx-auto mb-4 rounded-full bg-secondary/10">
      <span class="material-symbols-outlined text-4xl text-secondary">location_off</span>
    </div>
    <h3 class="text-xl font-bold text-[#111318] dark:text-white text-center mb-2">No Events Nearby</h3>
    <p id="no-event-message" class="text-gray-600 dark:text-gray-300 text-center mb-6">
      You must be within 100 meters of an active event to check in.
    </p>
    <button id="no-event-close" class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg active:scale-95 transition-transform">
      Return to Profile
    </button>
  </div>
</div>
