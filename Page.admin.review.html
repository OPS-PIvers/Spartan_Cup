<!--
  REVIEW SUBMISSIONS TAB
  Swipe-based interface for reviewing and approving/denying student event submissions
  Optimized for snappy UX with image preloading and optimistic updates
-->

<!-- ===================================================================== -->
<!-- TAB 1: REVIEW SUBMISSIONS (HTML) -->
<!-- ===================================================================== -->
<div id="tab-review" class="flex-1 flex flex-col overflow-y-auto">
  <!-- Queue Status -->
  <div class="mb-4 text-center">
    <p id="queue-status" class="text-sm text-gray-600 dark:text-gray-400">Loading submissions...</p>
  </div>

  <!-- Main Card Container -->
  <div id="card-container" class="flex-1 flex flex-col justify-center items-center px-4 relative">
    <!-- Swipe Hints -->
    <div class="absolute top-0 left-0 right-0 pt-2 flex justify-between text-xs font-semibold text-gray-400 dark:text-gray-500 px-4 pointer-events-none">
      <span>← Deny</span>
      <span>Approve →</span>
    </div>

    <!-- Card Stack Container -->
    <div id="swipe-card" class="hidden w-full max-w-sm bg-white dark:bg-gray-800 rounded-xl shadow-xl overflow-hidden touch-none select-none relative" style="max-height: 70vh;">
      <!-- Image Section with Double-Tap Indicator -->
      <div class="relative bg-gray-200">
        <img id="card-photo" src="" alt="Submission photo" class="w-full h-40 md:h-64 object-cover">
        <div id="bonus-badge" class="absolute top-3 right-3 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg hidden">
          ✓ +25 bonus
        </div>
        <!-- Mobile hint: Always visible with subtle styling -->
        <div class="md:hidden absolute bottom-2 left-2 right-2 text-center">
          <span class="text-white text-xs font-semibold bg-black/40 px-2 py-1 rounded-full backdrop-blur-sm">Double-tap image for theme bonus</span>
        </div>
        <!-- Desktop hint: Show on hover -->
        <div class="hidden md:flex absolute inset-0 items-center justify-center opacity-0 hover:opacity-100 transition-opacity bg-black/30">
          <span class="text-white text-sm font-semibold bg-black/60 px-4 py-2 rounded-lg">Double-click for theme bonus</span>
        </div>
      </div>

      <!-- Card Content -->
      <div class="p-3 md:p-6 space-y-2 md:space-y-4">
        <div class="space-y-1 md:space-y-2">
          <div class="flex justify-between gap-2">
            <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Student:</span>
            <span id="card-student" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
          </div>
          <div class="flex justify-between gap-2">
            <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Event:</span>
            <span id="card-event" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
          </div>
          <div class="flex justify-between gap-2">
            <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Theme:</span>
            <span id="card-theme" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
          </div>
          <div class="flex justify-between gap-2">
            <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Notes:</span>
            <span id="card-notes" class="text-xs md:text-sm text-[#111318] dark:text-white break-words text-right"></span>
          </div>
        </div>

        <!-- Points Display -->
        <div class="border-t border-gray-200 dark:border-gray-700 pt-2 md:pt-4">
          <div class="flex justify-between items-center">
            <span class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white">Points:</span>
            <span id="card-points-display" class="text-base md:text-lg font-bold text-primary">50</span>
          </div>
          <div id="points-breakdown" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 md:mt-1 text-right"></div>
        </div>

        <!-- Action Buttons (Hidden on mobile, visible on desktop) -->
        <div class="hidden md:flex border-t border-gray-200 dark:border-gray-700 pt-4 gap-3">
          <button id="btn-deny" class="flex-1 px-4 py-3 rounded-lg bg-secondary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
            <span>✗</span> Deny
          </button>
          <button id="btn-approve" class="flex-1 px-4 py-3 rounded-lg bg-primary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
            <span>✓</span> Approve
          </button>
        </div>

        <!-- Swipe Instructions (Hidden on mobile, visible on desktop) -->
        <div class="hidden md:block pt-2 text-center text-xs text-gray-400 dark:text-gray-500">
          <p>Or swipe left/right</p>
        </div>
      </div>

      <!-- Swipe Feedback Overlay (drag feedback) -->
      <div id="swipe-feedback" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-lg opacity-0 transition-opacity duration-200"></div>

      <!-- Action Confirmation Overlay (approval/denial feedback) -->
      <div id="confirmation-overlay" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-3xl opacity-0 transition-opacity duration-300" style="background: rgba(0, 0, 0, 0.6);"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-12 hidden">
      <p class="text-xl font-bold text-gray-600 dark:text-gray-400 mb-2">All submissions reviewed!</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">Great job keeping up with the queue.</p>
    </div>
  </div>
</div>

<!-- ===================================================================== -->
<!-- SUBMISSION REVIEW LOGIC (JavaScript) -->
<!-- ===================================================================== -->
<script>
  (function() {
    // =====================================================================
    // STATE & CONFIGURATION
    // =====================================================================
    let currentQueue = [];
    let currentIndex = 0;
    let hasThemeBonus = false;
    const THEME_BONUS_POINTS = 25;
    const BASE_POINTS = 50;

    // Image cache for preloading (reduces API calls and improves UX)
    const imageCache = {};
    const PRELOAD_AHEAD = 3;  // Preload 3 cards ahead

    // Touch/Mouse tracking for swipe gestures
    let touchStartX = 0;
    let touchStartY = 0;
    let touchCurrentX = 0;
    let isDragging = false;
    let lastTapTime = 0;
    let isProcessing = false;  // Prevent multiple simultaneous swipes

    // =====================================================================
    // INITIALIZATION
    // =====================================================================

    /**
     * Setup gesture handlers for swipe-based interface
     * Handles both touch (mobile) and mouse (desktop) events
     */
    function setupGestureHandlers() {
      const card = document.getElementById('swipe-card');
      const photo = document.getElementById('card-photo');

      if (!card || !photo) {
        console.error('Review tab: Required DOM elements not found');
        return;
      }

      // Touch events (mobile)
      card.addEventListener('touchstart', handleTouchStart, false);
      card.addEventListener('touchmove', handleTouchMove, false);
      card.addEventListener('touchend', handleTouchEnd, false);

      // Mouse events (desktop)
      card.addEventListener('mousedown', handleMouseStart, false);
      card.addEventListener('mousemove', handleMouseMove, false);
      card.addEventListener('mouseup', handleMouseEnd, false);

      // Double-tap/click on image for theme bonus toggle
      photo.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          toggleThemeBonus();
        }
        lastTapTime = now;
      });

      // Button click handlers (desktop fallback)
      const approveBtn = document.getElementById('btn-approve');
      const denyBtn = document.getElementById('btn-deny');

      if (approveBtn) {
        approveBtn.addEventListener('click', () => {
          if (!isProcessing) {
            isProcessing = true;
            approveCurrentSubmission(true);  // optimistic mode
            setTimeout(() => { isProcessing = false; }, 200);
          }
        });
      }

      if (denyBtn) {
        denyBtn.addEventListener('click', () => {
          if (!isProcessing) {
            isProcessing = true;
            denyCurrentSubmission(true);  // optimistic mode
            setTimeout(() => { isProcessing = false; }, 200);
          }
        });
      }
    }

    // =====================================================================
    // GESTURE HANDLING
    // =====================================================================

    function handleTouchStart(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchCurrentX = touchStartX;
      isDragging = true;
    }

    function handleTouchMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.touches[0].clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleTouchEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function handleMouseStart(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      touchCurrentX = touchStartX;
      isDragging = true;
    }

    function handleMouseMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleMouseEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function updateCardDrag(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const maxDistance = window.innerWidth / 2;

      // Apply drag transformation with rotation
      const rotation = (distance / maxDistance) * 15;
      const opacity = Math.abs(distance) / maxDistance;

      card.style.transform = `translateX(${distance}px) rotate(${rotation}deg)`;

      // Update feedback overlay text
      if (distance > 50) {
        feedback.textContent = '✓ Approve';
        feedback.style.backgroundColor = 'rgba(34, 197, 94, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else if (distance < -50) {
        feedback.textContent = '✗ Deny';
        feedback.style.backgroundColor = 'rgba(239, 68, 68, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else {
        feedback.style.opacity = 0;
      }
    }

    function handleSwipeEnd(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const threshold = 100;

      if (isProcessing) return;

      if (distance > threshold) {
        // APPROVE: Swipe right
        isProcessing = true;
        card.classList.add('animate-slide-right');
        approveCurrentSubmission(true);
      } else if (distance < -threshold) {
        // DENY: Swipe left
        isProcessing = true;
        card.classList.add('animate-slide-left');
        denyCurrentSubmission(true);
      } else {
        // Small swipe - reset card position
        card.style.transform = '';
        feedback.style.opacity = '0';
      }
    }

    // =====================================================================
    // THEME BONUS & POINTS
    // =====================================================================

    function toggleThemeBonus() {
      hasThemeBonus = !hasThemeBonus;
      const badge = document.getElementById('bonus-badge');
      const breakdown = document.getElementById('points-breakdown');

      if (hasThemeBonus) {
        badge.classList.remove('hidden');
        breakdown.textContent = `Base: ${BASE_POINTS} + Bonus: ${THEME_BONUS_POINTS}`;
      } else {
        badge.classList.add('hidden');
        breakdown.textContent = '';
      }

      updatePointsDisplay();
    }

    function updatePointsDisplay() {
      const total = BASE_POINTS + (hasThemeBonus ? THEME_BONUS_POINTS : 0);
      document.getElementById('card-points-display').textContent = total;
    }

    // =====================================================================
    // QUEUE & CARD MANAGEMENT
    // =====================================================================

    /**
     * Load the admin review queue from backend
     * Exported for use by tab switcher
     */
    window.loadReviewQueue = function() {
      google.script.run
        .withSuccessHandler(populateAdminQueue)
        .withFailureHandler((error) => {
          const status = document.getElementById('queue-status');
          status.innerHTML = `<p class="text-red-600 dark:text-red-400">Error loading queue: ${escapeHTML(error)}</p>`;
          showEmptyState();
        })
        .getAdminQueue();
    };

    function populateAdminQueue(response) {
      const status = document.getElementById('queue-status');

      if (!response || response.status === 'error') {
        status.innerHTML = `<p class="text-red-600 dark:text-red-400">${escapeHTML(response ? response.message : 'An unexpected error occurred.')}</p>`;
        showEmptyState();
        return;
      }

      currentQueue = response.queue || [];
      currentIndex = 0;
      status.textContent = currentQueue.length === 0 ? 'No pending submissions' : `${currentQueue.length} pending submission(s)`;

      if (currentQueue.length === 0) {
        showEmptyState();
      } else {
        displayCurrentCard();
      }
    }

    function displayCurrentCard() {
      if (currentIndex >= currentQueue.length) {
        showEmptyState();
        return;
      }

      const submission = currentQueue[currentIndex];
      hasThemeBonus = false;

      // Reset card animation and feedback
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      card.classList.remove('animate-slide-right', 'animate-slide-left', 'hidden');
      card.style.transform = '';
      card.classList.add('animate-fade-in');
      feedback.style.opacity = '0';
      feedback.textContent = '';

      // Hide empty state
      document.getElementById('empty-state').classList.add('hidden');

      // Load image (from cache if available, otherwise fetch)
      if (submission.photoId) {
        if (imageCache[submission.photoId]) {
          document.getElementById('card-photo').src = imageCache[submission.photoId];
        } else {
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[submission.photoId] = response.dataUrl;
              document.getElementById('card-photo').src = response.dataUrl;
            }
          }).serveImage(submission.photoId);
        }
      }

      // Update card content
      document.getElementById('card-student').textContent = submission.email;
      document.getElementById('card-event').textContent = submission.eventName;
      document.getElementById('card-theme').textContent = submission.dressedForTheme ? 'Yes' : 'No';
      document.getElementById('card-notes').textContent = submission.notes || '(none)';
      document.getElementById('bonus-badge').classList.add('hidden');
      document.getElementById('points-breakdown').textContent = '';
      updatePointsDisplay();

      // Preload next images in background
      preloadNextImages();
    }

    /**
     * Preload images for next N cards to reduce latency
     * Respects rate limiting by only preloading a small number ahead
     */
    function preloadNextImages() {
      for (let i = currentIndex + 1; i < Math.min(currentIndex + PRELOAD_AHEAD, currentQueue.length); i++) {
        const submission = currentQueue[i];
        if (submission.photoId && !imageCache[submission.photoId]) {
          const photoId = submission.photoId;
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[photoId] = response.dataUrl;
            }
          }).serveImage(photoId);
        }
      }
    }

    // =====================================================================
    // APPROVAL & DENIAL ACTIONS
    // =====================================================================

    function approveCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];

      if (!submission) {
        console.error('approveCurrentSubmission: No submission at index', currentIndex);
        showToast('Error: No submission to approve', 'error');
        isProcessing = false;
        return;
      }

      const themeBonusPoints = hasThemeBonus ? THEME_BONUS_POINTS : 0;

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend async
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Approved', '✓');
        isProcessing = false;

        // Fire backend approval in background
        google.script.run
          .withSuccessHandler((response) => {
            if (!response || response.status !== 'success') {
              showToast('⚠ Approval failed - check the backend logs', 'error', 4000);
            }
          })
          .withFailureHandler((error) => {
            showToast('❌ Network error: ' + error, 'error', 4000);
          })
          .approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      } else {
        // FALLBACK MODE: Wait for backend response
        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.status === 'success') {
              currentIndex++;
              displayCurrentCard();
            } else {
              showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
              resetCard();
            }
          })
          .withFailureHandler((error) => {
            showToast('Error: ' + error, 'error');
            resetCard();
          })
          .approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      }
    }

    function denyCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];

      if (!submission) {
        console.error('denyCurrentSubmission: No submission at index', currentIndex);
        showToast('Error: No submission to deny', 'error');
        isProcessing = false;
        return;
      }

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend async
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Denied', '✗');
        isProcessing = false;

        // Fire backend denial in background
        google.script.run
          .withSuccessHandler((response) => {
            if (!response || response.status !== 'success') {
              showToast('⚠ Denial failed - check the backend logs', 'error', 4000);
            }
          })
          .withFailureHandler((error) => {
            showToast('❌ Network error: ' + error, 'error', 4000);
          })
          .denySubmission(submission.submissionId, 'Denied via swipe');
      } else {
        // FALLBACK MODE: Wait for backend response
        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.status === 'success') {
              currentIndex++;
              displayCurrentCard();
            } else {
              showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
              resetCard();
            }
          })
          .withFailureHandler((error) => {
            showToast('Error: ' + error, 'error');
            resetCard();
          })
          .denySubmission(submission.submissionId, 'Denied via swipe');
      }
    }

    function resetCard() {
      const card = document.getElementById('swipe-card');
      card.style.transform = '';
      card.classList.remove('animate-slide-right', 'animate-slide-left');
    }

    function showConfirmation(message, icon) {
      const overlay = document.getElementById('confirmation-overlay');
      if (overlay) {
        overlay.textContent = icon + ' ' + message;
        overlay.style.opacity = '1';
        setTimeout(() => { overlay.style.opacity = '0'; }, 800);
      }
    }

    function showEmptyState() {
      document.getElementById('swipe-card').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
    }

    // =====================================================================
    // AUTO-INITIALIZATION
    // =====================================================================

    // Setup handlers immediately (DOM is ready since this is server-rendered)
    setupGestureHandlers();
  })();
</script>
