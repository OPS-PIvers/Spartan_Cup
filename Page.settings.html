<!--
  This file holds the content for the 'settings' page.
  It is dynamically injected into Index.html by Code.gs
-->
<div class="page p-4 pb-24">
  <div class="space-y-6">
    <!-- Account Section -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold text-primary dark:text-blue-300 mb-4">Account</h2>
      <div class="space-y-3">
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-400">Email</label>
          <p id="settings-email" class="text-[#111318] dark:text-white font-semibold">loading...</p>
        </div>
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-400">Display Name</label>
          <p id="settings-name" class="text-[#111318] dark:text-white font-semibold">loading...</p>
        </div>
      </div>
    </div>

    <!-- Appearance Section -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold text-[#111318] dark:text-white mb-4">Appearance</h2>
      <div class="space-y-4">
        <div class="flex items-center justify-between p-3 rounded-lg bg-gray-50 dark:bg-gray-700/30">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-2xl text-primary">dark_mode</span>
            <div>
              <p class="font-semibold text-[#111318] dark:text-white">Dark Mode</p>
              <p class="text-xs text-gray-600 dark:text-gray-400">Enable dark theme for easier reading at night</p>
            </div>
          </div>
          <button id="dark-mode-toggle" class="relative inline-flex h-7 w-12 items-center rounded-full bg-gray-300 dark:bg-primary transition-colors" role="switch" aria-checked="false">
            <span id="toggle-dot" class="inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform dark:translate-x-5"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Notifications Section -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold text-[#111318] dark:text-white mb-4">Notifications</h2>
      <div class="space-y-3">
        <label class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700/30 cursor-pointer">
          <input type="checkbox" id="event-notifications" checked class="h-5 w-5 rounded text-primary">
          <div>
            <p class="font-semibold text-[#111318] dark:text-white">Event Reminders</p>
            <p class="text-xs text-gray-600 dark:text-gray-400">Get notified about upcoming events</p>
          </div>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700/30 cursor-pointer">
          <input type="checkbox" id="approval-notifications" checked class="h-5 w-5 rounded text-primary">
          <div>
            <p class="font-semibold text-[#111318] dark:text-white">Submission Updates</p>
            <p class="text-xs text-gray-600 dark:text-gray-400">Notify when your submissions are approved or denied</p>
          </div>
        </label>

        <label class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700/30 cursor-pointer">
          <input type="checkbox" id="badge-notifications" checked class="h-5 w-5 rounded text-primary">
          <div>
            <p class="font-semibold text-[#111318] dark:text-white">Badge Achievements</p>
            <p class="text-xs text-gray-600 dark:text-gray-400">Celebrate when you earn new badges</p>
          </div>
        </label>
      </div>
    </div>

    <!-- About Section -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold text-[#111318] dark:text-white mb-4">About</h2>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-400">App Version</span>
          <span id="app-version" class="text-[#111318] dark:text-white font-semibold">loading...</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-400">School</span>
          <span class="text-[#111318] dark:text-white font-semibold">Orono High School</span>
        </div>
      </div>
    </div>

    <!-- Logout Button -->
    <button onclick="logoutUser()" class="w-full p-3 rounded-lg bg-secondary/10 dark:bg-secondary/20 text-secondary dark:text-red-400 font-bold hover:bg-secondary/20 dark:hover:bg-secondary/30 transition-colors">
      Log Out
    </button>
  </div>

  <script>
    // Store current settings in memory
    let currentSettings = {};

    // Execute immediately since this script runs after DOM is already ready
    // (the page is server-side rendered and included in Index.html)
    (function() {
      // Load user data
      document.getElementById('settings-email').textContent = APP_DATA.userEmail;
      document.getElementById('settings-name').textContent = APP_DATA.userName;
      document.getElementById('app-version').textContent = APP_DATA.appVersion;

      // Load settings from server (passed via APP_DATA)
      currentSettings = APP_DATA.userSettings || {
        darkMode: false,
        eventNotifications: true,
        approvalNotifications: true,
        badgeNotifications: true
      };

      // Set dark mode toggle state
      updateDarkModeToggle(currentSettings.darkMode);

      // Dark mode toggle
      document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);

      // Load notification preferences
      document.getElementById('event-notifications').checked = currentSettings.eventNotifications;
      document.getElementById('approval-notifications').checked = currentSettings.approvalNotifications;
      document.getElementById('badge-notifications').checked = currentSettings.badgeNotifications;

      // Save notification preferences immediately when changed
      ['event-notifications', 'approval-notifications', 'badge-notifications'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
          const settingKey = id.replace(/-/g, '');
          // Map checkbox IDs to setting keys
          if (id === 'event-notifications') currentSettings.eventNotifications = e.target.checked;
          else if (id === 'approval-notifications') currentSettings.approvalNotifications = e.target.checked;
          else if (id === 'badge-notifications') currentSettings.badgeNotifications = e.target.checked;

          saveSettingsToServer();
        });
      });
    })(); // Execute the IIFE immediately

    function toggleDarkMode() {
      const isDarkMode = document.documentElement.classList.contains('dark');
      const newState = !isDarkMode;
      currentSettings.darkMode = newState;
      updateDarkModeToggle(newState);
      saveSettingsToServer();
    }

    function updateDarkModeToggle(isDarkMode) {
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        document.getElementById('dark-mode-toggle').setAttribute('aria-checked', 'true');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('dark-mode-toggle').setAttribute('aria-checked', 'false');
      }
    }

    function saveSettingsToServer() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === 'success') {
            console.log('Settings saved to server');
          } else {
            alert('Error saving settings: ' + response.message);
          }
        })
        .withFailureHandler(function(error) {
          alert('Failed to save settings: ' + error);
        })
        .saveUserSettings(currentSettings);
    }

    function logoutUser() {
      // Use dedicated logout modal to avoid conflicts with event submission modal handlers
      const modal = document.getElementById('logout-confirm-modal');
      modal.classList.remove('hidden');

      // Handle proceed button click (using { once: true } to prevent memory leaks)
      const proceedHandler = () => {
        modal.classList.add('hidden');

        // Google Apps Script will handle logout via the Apps Script authentication
        // Build URL programmatically to avoid Caja sanitizer breaking string literals
        const link = document.createElement('a');
        const protocol = 'https' + ':';
        const domain = '//accounts.google.com';
        const path = '/logout';
        link.href = protocol + domain + path;
        link.target = '_top';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Handle cancel button click (using { once: true } to prevent memory leaks)
      const cancelHandler = () => {
        modal.classList.add('hidden');
      };

      document.getElementById('logout-proceed').addEventListener('click', proceedHandler, { once: true });
      document.getElementById('logout-cancel').addEventListener('click', cancelHandler, { once: true });
    }
  </script>
</div>
