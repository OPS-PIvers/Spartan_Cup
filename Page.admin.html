<!--
  ADMIN DASHBOARD - Main Coordinator File

  This file has been refactored into modular components for better maintainability.
  Each admin tab is now in its own file and included via the include() function.

  Component Files:
  - Page.admin.utils.html - Shared utility functions
  - Page.admin.review.html - Submission review tab
  - Page.admin.events.html - Events management tab
  - Page.admin.season.html - Season management tab
  - Page.admin.badges.html - Badge configuration tab
  - Page.admin.prizes.html - Prizes management tab
  - Page.admin.points.html - Points configuration tab

  Features:
  - Responsive tab navigation (mobile dropdown + desktop sidebar)
  - Lazy loading of tab content to reduce initial API calls
  - Optimized for caching and rate limiting
-->

<div class="page p-4 flex flex-col md:flex-row">
  <!-- ===================================================================== -->
  <!-- MOBILE NAVIGATION (Dropdown) -->
  <!-- ===================================================================== -->
  <div class="md:hidden mb-4">
    <label for="mobile-tab-select" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Admin Section</label>
    <select id="mobile-tab-select" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-semibold focus:border-primary focus:outline-none transition-colors">
      <option value="review">Review Submissions</option>
      <option value="events">Manage Events</option>
      <option value="season">Manage Season</option>
      <option value="badges">Configure Badges</option>
      <option value="prizes">Manage Prizes</option>
      <option value="points">Configure Points</option>
    </select>
  </div>

  <!-- ===================================================================== -->
  <!-- DESKTOP NAVIGATION (Sidebar) -->
  <!-- ===================================================================== -->
  <div class="hidden md:flex md:flex-col md:w-48 md:flex-shrink-0 md:mr-6 md:space-y-2">
    <button id="tab-review-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">fact_check</span>
      <span>Review</span>
    </button>
    <button id="tab-events-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">event</span>
      <span>Events</span>
    </button>
    <button id="tab-season-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">calendar_month</span>
      <span>Season</span>
    </button>
    <button id="tab-badges-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">military_tech</span>
      <span>Badges</span>
    </button>
    <button id="tab-prizes-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">redeem</span>
      <span>Prizes</span>
    </button>
    <button id="tab-points-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">stars</span>
      <span>Points</span>
    </button>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB CONTENT CONTAINER -->
  <!-- ===================================================================== -->
  <div class="flex-1 flex flex-col">
    <!-- Admin components injected here by Index.html via getAdminComponents() -->
    <!-- Components are loaded at the top template evaluation level for proper rendering -->
  </div>
</div>

<!-- ===================================================================== -->
<!-- SHARED STYLES -->
<!-- ===================================================================== -->
<style>
  /* Swipe card animations */
  @keyframes slide-right {
    to {
      transform: translateX(150%) rotate(20deg);
      opacity: 0;
    }
  }

  @keyframes slide-left {
    to {
      transform: translateX(-150%) rotate(-20deg);
      opacity: 0;
    }
  }

  @keyframes fade-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .animate-slide-right {
    animation: slide-right 0.4s ease-in forwards;
  }

  .animate-slide-left {
    animation: slide-left 0.4s ease-in forwards;
  }

  .animate-fade-in {
    animation: fade-in 0.3s ease-out;
  }

  /* Active tab styling */
  .active-tab {
    background-color: #1b3b87;
  }
</style>

<!-- ===================================================================== -->
<!-- TAB MANAGEMENT & INITIALIZATION -->
<!-- ===================================================================== -->
<script>
  (function() {
    'use strict';

    // =====================================================================
    // TAB REFERENCES
    // =====================================================================
    const tabs = {
      review: document.getElementById('tab-review'),
      events: document.getElementById('tab-events'),
      season: document.getElementById('tab-season'),
      badges: document.getElementById('tab-badges'),
      prizes: document.getElementById('tab-prizes'),
      points: document.getElementById('tab-points')
    };

    const buttons = {
      review: document.getElementById('tab-review-btn'),
      events: document.getElementById('tab-events-btn'),
      season: document.getElementById('tab-season-btn'),
      badges: document.getElementById('tab-badges-btn'),
      prizes: document.getElementById('tab-prizes-btn'),
      points: document.getElementById('tab-points-btn')
    };

    // Track which tabs have been loaded (for lazy loading)
    const loadedTabs = {
      review: false,
      events: false,
      season: false,
      badges: false,
      prizes: false,
      points: false
    };

    // =====================================================================
    // TAB SWITCHING FUNCTION
    // =====================================================================

    /**
     * Switch between admin tabs with lazy loading
     * @param {string} tabName - Name of tab to switch to ('review', 'events', etc.)
     */
    function switchTab(tabName) {
      // Hide all tabs
      Object.values(tabs).forEach(tab => tab && tab.classList.add('hidden'));

      // Reset all button styles
      const allButtons = Object.values(buttons);
      allButtons.forEach(btn => {
        if (btn) {
          btn.classList.remove('active-tab', 'bg-primary', 'text-white');
          btn.classList.add('bg-gray-300', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
        }
      });

      // Tab-specific load functions (called on first view only for lazy loading)
      const tabConfig = {
        review: {
          loadFunc: window.loadReviewQueue,
          multiLoad: false  // Single function call
        },
        events: {
          loadFunc: window.loadEventsList,
          multiLoad: false
        },
        season: {
          loadFunc: window.loadSeasonManagement,
          multiLoad: false
        },
        badges: {
          loadFunc: () => {
            // Badges tab needs two separate data loads
            if (window.loadBadgesList) window.loadBadgesList();
            if (window.loadActivitiesForBadges) window.loadActivitiesForBadges();
          },
          multiLoad: true
        },
        prizes: {
          loadFunc: window.loadPrizesList,
          multiLoad: false
        },
        points: {
          loadFunc: window.loadPointsConfig,
          multiLoad: false
        }
      };

      // Show selected tab
      const selectedTab = tabs[tabName];
      const selectedBtn = buttons[tabName];
      const config = tabConfig[tabName];

      if (selectedTab && selectedBtn) {
        // Update UI
        selectedTab.classList.remove('hidden');
        selectedBtn.classList.remove('bg-gray-300', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
        selectedBtn.classList.add('active-tab', 'bg-primary', 'text-white');

        // Sync mobile dropdown
        const mobileSelect = document.getElementById('mobile-tab-select');
        if (mobileSelect) {
          mobileSelect.value = tabName;
        }

        // Lazy load tab content (only on first view to reduce API calls)
        if (config && config.loadFunc && !loadedTabs[tabName]) {
          config.loadFunc();
          loadedTabs[tabName] = true;  // Mark as loaded
        }
      } else {
        console.error('Admin Dashboard: Invalid tab name:', tabName);
      }
    }

    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================

    // Desktop sidebar buttons
    Object.keys(buttons).forEach(tabName => {
      const btn = buttons[tabName];
      if (btn) {
        btn.addEventListener('click', () => switchTab(tabName));
      }
    });

    // Mobile dropdown
    const mobileTabSelect = document.getElementById('mobile-tab-select');
    if (mobileTabSelect) {
      mobileTabSelect.addEventListener('change', (e) => {
        switchTab(e.target.value);
      });
    }

    // =====================================================================
    // INITIALIZATION
    // =====================================================================

    // Initialize with Review tab active (on page load)
    // Lazy loading prevents initial API call until user views tab
    switchTab('review');
  })();
</script>
