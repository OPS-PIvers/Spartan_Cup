<!--
  This file holds the content for the 'admin' page.
  It is dynamically injected into Index.html by Code.gs

  Features:
  - Swipe-based review interface for submission approval/denial
  - Event management (CRUD) for Config_Event_Codes sheet
-->
<div class="page p-4 pb-24 flex flex-col h-screen">
  <!-- Tab Navigation -->
  <div class="flex gap-2 mb-4">
    <button id="tab-review-btn" class="flex-1 px-4 py-2 rounded-lg font-semibold bg-primary text-white transition-all active-tab">
      Review Submissions
    </button>
    <button id="tab-events-btn" class="flex-1 px-4 py-2 rounded-lg font-semibold bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 transition-all">
      Manage Events
    </button>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB 1: REVIEW SUBMISSIONS -->
  <!-- ===================================================================== -->
  <div id="tab-review" class="flex-1 flex flex-col">
    <!-- Header -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm border-l-4 border-secondary mb-4">
      <h2 class="text-2xl font-bold text-secondary dark:text-red-400 mb-2">Admin Dashboard</h2>
      <p id="queue-status" class="text-sm text-gray-600 dark:text-gray-400">Loading submissions...</p>
    </div>

    <!-- Main Card Container -->
    <div id="card-container" class="flex-1 flex flex-col justify-center items-center px-4 relative">
      <!-- Swipe Hints -->
      <div class="absolute top-0 left-0 right-0 pt-2 flex justify-between text-xs font-semibold text-gray-400 dark:text-gray-500 px-4 pointer-events-none">
        <span>← Deny</span>
        <span>Approve →</span>
      </div>

      <!-- Card Stack Container -->
      <div id="swipe-card" class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-xl shadow-xl overflow-hidden touch-none select-none relative" style="max-height: 70vh;">
        <!-- Image Section with Double-Tap Indicator -->
        <div class="relative bg-gray-200">
          <img id="card-photo" src="" alt="Submission photo" class="w-full h-64 object-cover">
          <div id="bonus-badge" class="absolute top-3 right-3 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full hidden">
            ✓ +25 bonus
          </div>
          <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-10 transition-opacity">
            <span class="text-white text-sm font-semibold">Double-tap for bonus</span>
          </div>
        </div>

        <!-- Card Content -->
        <div class="p-6 space-y-4">
          <div class="space-y-2">
            <div class="flex justify-between">
              <span class="text-sm text-gray-600 dark:text-gray-400">Student:</span>
              <span id="card-student" class="text-sm font-semibold text-[#111318] dark:text-white"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-gray-600 dark:text-gray-400">Event:</span>
              <span id="card-event" class="text-sm font-semibold text-[#111318] dark:text-white"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-gray-600 dark:text-gray-400">Dressed for Theme:</span>
              <span id="card-theme" class="text-sm font-semibold text-[#111318] dark:text-white"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-gray-600 dark:text-gray-400">Notes:</span>
              <span id="card-notes" class="text-sm text-[#111318] dark:text-white break-words"></span>
            </div>
          </div>

          <!-- Points Display -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
            <div class="flex justify-between items-center">
              <span class="text-sm font-semibold text-[#111318] dark:text-white">Points:</span>
              <span id="card-points-display" class="text-lg font-bold text-primary">50</span>
            </div>
            <div id="points-breakdown" class="text-xs text-gray-500 dark:text-gray-400 mt-1 text-right"></div>
          </div>

          <!-- Action Buttons -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-4 flex gap-3">
            <button id="btn-deny" class="flex-1 px-4 py-3 rounded-lg bg-secondary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
              <span>✗</span> Deny
            </button>
            <button id="btn-approve" class="flex-1 px-4 py-3 rounded-lg bg-primary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
              <span>✓</span> Approve
            </button>
          </div>

          <!-- Swipe Instructions (Optional) -->
          <div class="pt-2 text-center text-xs text-gray-400 dark:text-gray-500">
            <p>Or swipe left/right</p>
          </div>
        </div>

        <!-- Swipe Feedback Overlay (drag feedback) -->
        <div id="swipe-feedback" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-lg opacity-0 transition-opacity duration-200"></div>

        <!-- Action Confirmation Overlay (approval/denial feedback) -->
        <div id="confirmation-overlay" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-3xl opacity-0 transition-opacity duration-300" style="background: rgba(0, 0, 0, 0.6);"></div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-12 hidden">
        <p class="text-xl font-bold text-gray-600 dark:text-gray-400 mb-2">All submissions reviewed!</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Great job keeping up with the queue.</p>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB 2: MANAGE EVENTS -->
  <!-- ===================================================================== -->
  <div id="tab-events" class="flex-1 flex flex-col hidden">
    <!-- Event Form -->
    <div class="bg-white dark:bg-gray-800/50 p-6 rounded-xl shadow-sm border-l-4 border-primary mb-4">
      <h2 class="text-2xl font-bold text-primary dark:text-blue-300 mb-4">Add/Edit Event</h2>
      <form id="event-form" class="space-y-3 max-h-96 overflow-y-auto pr-2">
        <!-- Event ID -->
        <input id="event-id" type="text" placeholder="Event ID (e.g., GBB-01)" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white" required>

        <!-- Event Name -->
        <input id="event-name" type="text" placeholder="Event Name (e.g., vs. Edina)" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white" required>

        <!-- Sport/Art -->
        <input id="event-sport" type="text" placeholder="Sport/Art (e.g., Girls Basketball)" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white">

        <!-- Date -->
        <input id="event-date" type="date" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white" required>

        <!-- Location -->
        <input id="event-location" type="text" placeholder="Location Name" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white">

        <!-- Start Time -->
        <input id="event-start" type="datetime-local" placeholder="Start Time" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white" required>

        <!-- Duration (hidden, always 2 hours) -->
        <input id="event-duration" type="hidden" value="2">

        <!-- Latitude and Longitude -->
        <div class="grid grid-cols-2 gap-2">
          <input id="event-lat" type="number" placeholder="Latitude" step="0.0001" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white">
          <input id="event-lon" type="number" placeholder="Longitude" step="0.0001" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white">
        </div>
        <button type="button" id="coord-helper-btn" class="w-full px-3 py-2 text-sm bg-blue-500 dark:bg-blue-600 text-white rounded-lg hover:bg-blue-600">
          Get My Location
        </button>

        <!-- Home Game -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="event-home" type="checkbox" class="w-4 h-4">
          <span class="text-sm text-[#111318] dark:text-white">Home Game</span>
        </label>

        <!-- Spotlight Game -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="event-spotlight" type="checkbox" class="w-4 h-4">
          <span class="text-sm text-[#111318] dark:text-white">Spotlight Game</span>
        </label>

        <!-- Theme -->
        <input id="event-theme" type="text" placeholder="Theme (e.g., White Out)" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-[#111318] dark:text-white">

        <!-- Submit/Cancel -->
        <div class="flex gap-2">
          <button type="submit" class="flex-1 px-4 py-2 rounded-lg bg-primary text-white font-semibold hover:bg-opacity-90">
            Save Event
          </button>
          <button type="button" id="event-cancel-btn" class="flex-1 px-4 py-2 rounded-lg bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-semibold">
            Clear
          </button>
        </div>
      </form>
    </div>

    <!-- Events List -->
    <div class="flex-1 overflow-y-auto">
      <h3 class="text-lg font-bold text-[#111318] dark:text-white mb-3">Active Events</h3>
      <div id="events-list" class="space-y-2">
        <div class="text-center py-6 text-gray-500">Loading events...</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes slide-right {
      to {
        transform: translateX(150%) rotate(20deg);
        opacity: 0;
      }
    }
    @keyframes slide-left {
      to {
        transform: translateX(-150%) rotate(-20deg);
        opacity: 0;
      }
    }
    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .animate-slide-right {
      animation: slide-right 0.4s ease-in forwards;
    }
    .animate-slide-left {
      animation: slide-left 0.4s ease-in forwards;
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }
    .active-tab {
      background-color: #1b3b87;
    }
  </style>

  <script>
    // =====================================================================
    // TAB MANAGEMENT
    // =====================================================================
    const reviewTab = document.getElementById('tab-review');
    const eventsTab = document.getElementById('tab-events');
    const reviewBtn = document.getElementById('tab-review-btn');
    const eventsBtn = document.getElementById('tab-events-btn');

    reviewBtn.addEventListener('click', () => {
      reviewTab.classList.remove('hidden');
      eventsTab.classList.add('hidden');
      reviewBtn.classList.add('active-tab');
      reviewBtn.style.backgroundColor = '#1b3b87';
      reviewBtn.style.color = 'white';
      eventsBtn.classList.remove('active-tab');
      eventsBtn.style.backgroundColor = '';
      eventsBtn.style.color = '';
    });

    eventsBtn.addEventListener('click', () => {
      reviewTab.classList.add('hidden');
      eventsTab.classList.remove('hidden');
      eventsBtn.classList.add('active-tab');
      eventsBtn.style.backgroundColor = '#1b3b87';
      eventsBtn.style.color = 'white';
      reviewBtn.classList.remove('active-tab');
      reviewBtn.style.backgroundColor = '';
      reviewBtn.style.color = '';
      loadEventsList();
    });

    // =====================================================================
    // SUBMISSION REVIEW LOGIC (OPTIMIZED FOR SNAPPY UX)
    // =====================================================================
    let currentQueue = [];
    let currentIndex = 0;
    let hasThemeBonus = false;
    const THEME_BONUS_POINTS = 25;
    const BASE_POINTS = 50;

    // Image cache for preloading
    const imageCache = {};
    const PRELOAD_AHEAD = 3;  // Preload 3 cards ahead

    // Touch/Mouse tracking
    let touchStartX = 0;
    let touchStartY = 0;
    let touchCurrentX = 0;
    let isDragging = false;
    let lastTapTime = 0;
    let isProcessing = false;  // Prevent multiple simultaneous swipes

    document.addEventListener('DOMContentLoaded', () => {
      loadAdminQueue();
      setupGestureHandlers();
    });

    function setupGestureHandlers() {
      const card = document.getElementById('swipe-card');
      const photo = document.getElementById('card-photo');

      // Touch events
      card.addEventListener('touchstart', handleTouchStart, false);
      card.addEventListener('touchmove', handleTouchMove, false);
      card.addEventListener('touchend', handleTouchEnd, false);

      // Mouse events (for desktop)
      card.addEventListener('mousedown', handleMouseStart, false);
      card.addEventListener('mousemove', handleMouseMove, false);
      card.addEventListener('mouseup', handleMouseEnd, false);

      // Double-tap on image for theme bonus
      photo.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          toggleThemeBonus();
        }
        lastTapTime = now;
      });

      // Button click handlers
      document.getElementById('btn-approve').addEventListener('click', () => {
        if (!isProcessing) {
          isProcessing = true;
          approveCurrentSubmission(true);  // optimistic mode
          setTimeout(() => {
            isProcessing = false;
          }, 200);
        }
      });

      document.getElementById('btn-deny').addEventListener('click', () => {
        if (!isProcessing) {
          isProcessing = true;
          denyCurrentSubmission(true);  // optimistic mode
          setTimeout(() => {
            isProcessing = false;
          }, 200);
        }
      });
    }

    // Toast notification system
    function showToast(message, type = 'error', duration = 3000) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg font-semibold text-white text-sm shadow-lg transition-opacity ${
        type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500'
      }`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // Show action confirmation overlay (Approved/Denied)
    function showConfirmation(message, icon) {
      const overlay = document.getElementById('confirmation-overlay');
      overlay.textContent = icon + ' ' + message;
      overlay.style.opacity = '1';

      // Fade in, hold, fade out
      setTimeout(() => {
        overlay.style.opacity = '0';
      }, 800);  // Hold for 800ms before fading out
    }

    // Preload images for next N cards
    function preloadNextImages() {
      for (let i = currentIndex + 1; i < Math.min(currentIndex + PRELOAD_AHEAD, currentQueue.length); i++) {
        const submission = currentQueue[i];
        if (submission.photoId && !imageCache[submission.photoId]) {
          // Capture photoId in closure to avoid reference issues
          const photoId = submission.photoId;
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[photoId] = response.dataUrl;
            }
          }).serveImage(photoId);
        }
      }
    }

    function handleTouchStart(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging = true;
    }

    function handleTouchMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.touches[0].clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleTouchEnd(e) {
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function handleMouseStart(e) {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      isDragging = true;
    }

    function handleMouseMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleMouseEnd(e) {
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function updateCardDrag(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const maxDistance = window.innerWidth / 2;

      // Apply drag transformation
      const rotation = (distance / maxDistance) * 15;
      const opacity = Math.abs(distance) / maxDistance;

      card.style.transform = `translateX(${distance}px) rotate(${rotation}deg)`;

      // Update feedback text
      if (distance > 50) {
        feedback.textContent = '✓ Approve';
        feedback.style.backgroundColor = 'rgba(34, 197, 94, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else if (distance < -50) {
        feedback.textContent = '✗ Deny';
        feedback.style.backgroundColor = 'rgba(239, 68, 68, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else {
        feedback.style.opacity = 0;
      }
    }

    function handleSwipeEnd(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const threshold = 100;

      // Prevent multiple simultaneous swipes
      if (isProcessing) return;

      if (distance > threshold) {
        // APPROVE: Swipe right
        isProcessing = true;
        card.classList.add('animate-slide-right');

        // Fire approval action (optimistic - shows next card immediately)
        approveCurrentSubmission(true);
      } else if (distance < -threshold) {
        // DENY: Swipe left
        isProcessing = true;
        card.classList.add('animate-slide-left');

        // Fire denial action (optimistic - shows next card immediately)
        denyCurrentSubmission(true);
      } else {
        // Small swipe - reset card position and feedback
        card.style.transform = '';
        feedback.style.opacity = '0';
      }
    }

    function toggleThemeBonus() {
      hasThemeBonus = !hasThemeBonus;
      const badge = document.getElementById('bonus-badge');
      const breakdown = document.getElementById('points-breakdown');

      if (hasThemeBonus) {
        badge.classList.remove('hidden');
        breakdown.textContent = `Base: ${BASE_POINTS} + Bonus: ${THEME_BONUS_POINTS}`;
      } else {
        badge.classList.add('hidden');
        breakdown.textContent = '';
      }

      updatePointsDisplay();
    }

    function updatePointsDisplay() {
      const total = BASE_POINTS + (hasThemeBonus ? THEME_BONUS_POINTS : 0);
      document.getElementById('card-points-display').textContent = total;
    }

    function loadAdminQueue() {
      google.script.run.withSuccessHandler(populateAdminQueue).getAdminQueue();
    }

    function populateAdminQueue(response) {
      const status = document.getElementById('queue-status');

      if (!response || response.status === 'error') {
        status.innerHTML = `<p class="text-red-600 dark:text-red-400">${response ? response.message : 'An unexpected error occurred.'}</p>`;
        showEmptyState();
        return;
      }

      currentQueue = response.queue || [];
      currentIndex = 0;
      status.textContent = currentQueue.length === 0 ? 'No pending submissions' : `${currentQueue.length} pending submission(s)`;

      if (currentQueue.length === 0) {
        showEmptyState();
      } else {
        displayCurrentCard();
      }
    }

    function displayCurrentCard() {
      if (currentIndex >= currentQueue.length) {
        showEmptyState();
        return;
      }

      const submission = currentQueue[currentIndex];
      hasThemeBonus = false;

      // Reset card animation and feedback overlay
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      card.classList.remove('animate-slide-right', 'animate-slide-left');
      card.style.transform = '';
      card.classList.add('animate-fade-in');
      feedback.style.opacity = '0';
      feedback.textContent = '';

      // Load image from cache (pre-loaded) or fetch if needed
      if (submission.photoId) {
        if (imageCache[submission.photoId]) {
          // Use cached image (instant)
          document.getElementById('card-photo').src = imageCache[submission.photoId];
        } else {
          // Fallback: load image (shouldn't happen with preloading)
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[submission.photoId] = response.dataUrl;
              document.getElementById('card-photo').src = response.dataUrl;
            }
          }).serveImage(submission.photoId);
        }
      }

      // Update card content
      document.getElementById('card-student').textContent = submission.email;
      document.getElementById('card-event').textContent = submission.eventName;
      document.getElementById('card-theme').textContent = submission.dressedForTheme ? 'Yes' : 'No';
      document.getElementById('card-notes').textContent = submission.notes || '(none)';
      document.getElementById('bonus-badge').classList.add('hidden');
      document.getElementById('points-breakdown').textContent = '';
      updatePointsDisplay();

      // Preload next images in background
      preloadNextImages();
    }

    function approveCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];
      const themeBonusPoints = hasThemeBonus ? THEME_BONUS_POINTS : 0;

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend asynchronously
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Approved', '✓');  // Show confirmation feedback
        isProcessing = false;  // Allow next swipe/click

        // Fire backend approval in background (don't wait for response)
        google.script.run.withSuccessHandler((response) => {
          if (!response || response.status !== 'success') {
            showToast('⚠ Approval failed - check the backend logs', 'error', 4000);
          }
        }).withFailureHandler((error) => {
          showToast('❌ Network error: ' + error, 'error', 4000);
        }).approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      } else {
        // FALLBACK MODE: Wait for backend (used for manual button clicks)
        google.script.run.withSuccessHandler((response) => {
          if (response && response.status === 'success') {
            currentIndex++;
            displayCurrentCard();
          } else {
            showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
            // Reset card for retry
            document.getElementById('swipe-card').style.transform = '';
            document.getElementById('swipe-card').classList.remove('animate-slide-right');
          }
        }).withFailureHandler((error) => {
          showToast('Error: ' + error, 'error');
          // Reset card for retry
          document.getElementById('swipe-card').style.transform = '';
          document.getElementById('swipe-card').classList.remove('animate-slide-right');
        }).approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      }
    }

    function denyCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend asynchronously
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Denied', '✗');  // Show confirmation feedback
        isProcessing = false;  // Allow next swipe/click

        // Fire backend denial in background (don't wait for response)
        google.script.run.withSuccessHandler((response) => {
          if (!response || response.status !== 'success') {
            showToast('⚠ Denial failed - check the backend logs', 'error', 4000);
          }
        }).withFailureHandler((error) => {
          showToast('❌ Network error: ' + error, 'error', 4000);
        }).denySubmission(submission.submissionId, 'Denied via swipe');
      } else {
        // FALLBACK MODE: Wait for backend (used for manual button clicks)
        google.script.run.withSuccessHandler((response) => {
          if (response && response.status === 'success') {
            currentIndex++;
            displayCurrentCard();
          } else {
            showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
            // Reset card for retry
            document.getElementById('swipe-card').style.transform = '';
            document.getElementById('swipe-card').classList.remove('animate-slide-left');
          }
        }).withFailureHandler((error) => {
          showToast('Error: ' + error, 'error');
          // Reset card for retry
          document.getElementById('swipe-card').style.transform = '';
          document.getElementById('swipe-card').classList.remove('animate-slide-left');
        }).denySubmission(submission.submissionId, 'Denied via swipe');
      }
    }

    function showEmptyState() {
      document.getElementById('swipe-card').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
    }

    // =====================================================================
    // EVENT MANAGEMENT LOGIC
    // =====================================================================
    let editingEventCode = null;

    document.getElementById('event-form').addEventListener('submit', (e) => {
      e.preventDefault();
      saveEvent();
    });

    document.getElementById('event-cancel-btn').addEventListener('click', () => {
      clearEventForm();
    });

    // Coordinate helper button
    document.getElementById('coord-helper-btn').addEventListener('click', (e) => {
      e.preventDefault();
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lon = position.coords.longitude.toFixed(6);
            document.getElementById('event-lat').value = lat;
            document.getElementById('event-lon').value = lon;
            alert('Location set! Latitude: ' + lat + ', Longitude: ' + lon);
          },
          (error) => {
            alert('Could not get your location. Please enter coordinates manually.\n\nError: ' + error.message);
          }
        );
      } else {
        alert('Geolocation is not supported by your browser. Please enter coordinates manually.');
      }
    });

    function saveEvent() {
      const eventId = document.getElementById('event-id').value.trim();
      const eventName = document.getElementById('event-name').value.trim();
      const sportArt = document.getElementById('event-sport').value.trim();
      const date = document.getElementById('event-date').value;
      const location = document.getElementById('event-location').value.trim();
      const startTime = document.getElementById('event-start').value;
      const lat = parseFloat(document.getElementById('event-lat').value) || 0;
      const lon = parseFloat(document.getElementById('event-lon').value) || 0;
      const isHomeGame = document.getElementById('event-home').checked;
      const isSpotlightGame = document.getElementById('event-spotlight').checked;
      const theme = document.getElementById('event-theme').value.trim();

      if (!eventId) {
        alert('Event ID is required (e.g., GBB-01)');
        return;
      }
      if (!eventName) {
        alert('Event name is required');
        return;
      }
      if (!date) {
        alert('Date is required');
        return;
      }

      const eventData = {
        eventId,
        eventName,
        sportArt,
        date,
        location,
        startTime,
        lat,
        lon,
        isHomeGame,
        isSpotlightGame,
        theme,
        duration: 2  // Always 2 hours
      };

      if (editingEventCode) {
        // Update existing event
        google.script.run.withSuccessHandler((response) => {
          if (response.status === 'success') {
            alert(response.message);
            clearEventForm();
            loadEventsList();
          } else {
            alert('Error: ' + response.message);
          }
        }).updateEvent(editingEventCode, eventData);
      } else {
        // Add new event
        google.script.run.withSuccessHandler((response) => {
          if (response.status === 'success') {
            alert(response.message);
            clearEventForm();
            loadEventsList();
          } else {
            alert('Error: ' + response.message);
          }
        }).addEvent(eventData);
      }
    }

    function clearEventForm() {
      document.getElementById('event-form').reset();
      editingEventCode = null;
      document.querySelector('#event-form button[type="submit"]').textContent = 'Save Event';
    }

    function loadEventsList() {
      google.script.run.withSuccessHandler((response) => {
        if (response.status === 'success') {
          populateEventsList(response.events);
        } else {
          document.getElementById('events-list').innerHTML = '<p class="text-red-600">Error loading events: ' + response.message + '</p>';
        }
      }).getEventsList();
    }

    function populateEventsList(events) {
      const list = document.getElementById('events-list');
      list.innerHTML = '';

      if (events.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-center py-6">No events yet. Create one to get started.</p>';
        return;
      }

      events.forEach((event) => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 p-4 rounded-lg border border-gray-200 dark:border-gray-700';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div class="flex-1">
              <p class="font-bold text-[#111318] dark:text-white">${event.eventName}</p>
              <p class="text-sm text-gray-600 dark:text-gray-400">ID: ${event.eventId}</p>
              <p class="text-sm text-gray-600 dark:text-gray-400">${event.sportArt} • ${event.date}</p>
              <p class="text-sm text-gray-600 dark:text-gray-400">📍 ${event.location || 'No location'}</p>
              ${event.theme ? `<p class="text-xs text-gray-500 dark:text-gray-500">Theme: ${event.theme}</p>` : ''}
            </div>
            <div class="flex gap-2">
              <button class="px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600" onclick="editEvent('${event.eventId.replace(/'/g, "\\'")}', '${event.eventName.replace(/'/g, "\\'")}', '${event.sportArt.replace(/'/g, "\\'")}', '${event.date}', '${event.location.replace(/'/g, "\\'")}', '${event.startTime}', '${event.theme.replace(/'/g, "\\'")}', ${event.isHomeGame}, ${event.isSpotlightGame}, ${event.lat}, ${event.lon})">
                Edit
              </button>
              <button class="px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600" onclick="deleteEventConfirm('${event.eventId.replace(/'/g, "\\'")}', '${event.eventName.replace(/'/g, "\\'")}')">
                Delete
              </button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function editEvent(eventId, eventName, sportArt, date, location, startTime, theme, isHomeGame, isSpotlightGame, lat, lon) {
      document.getElementById('event-id').value = eventId;
      document.getElementById('event-name').value = eventName;
      document.getElementById('event-sport').value = sportArt;
      document.getElementById('event-date').value = date;
      document.getElementById('event-location').value = location;
      document.getElementById('event-start').value = startTime;
      document.getElementById('event-theme').value = theme;
      document.getElementById('event-home').checked = isHomeGame;
      document.getElementById('event-spotlight').checked = isSpotlightGame;
      document.getElementById('event-lat').value = lat || '';
      document.getElementById('event-lon').value = lon || '';
      document.querySelector('#event-form button[type="submit"]').textContent = 'Update Event';
      editingEventCode = eventId;

      // Scroll to form
      document.getElementById('event-form').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteEventConfirm(eventId, eventName) {
      if (confirm(`Delete event "${eventName}" (${eventId})?`)) {
        google.script.run.withSuccessHandler((response) => {
          if (response.status === 'success') {
            alert(response.message);
            loadEventsList();
          } else {
            alert('Error: ' + response.message);
          }
        }).deleteEvent(eventId);
      }
    }
  </script>
</div>
