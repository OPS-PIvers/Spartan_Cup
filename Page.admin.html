<!--
  This file holds the content for the 'admin' page.
  It is dynamically injected into Index.html by Code.gs

  Features:
  - Swipe-based review interface for submission approval/denial
  - Event management (CRUD) for Config_Event_Codes sheet
-->
<div class="page p-4 flex flex-col md:flex-row">
  <!-- Mobile Dropdown Navigation (visible on mobile only) -->
  <div class="md:hidden mb-4">
    <label for="mobile-tab-select" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Admin Section</label>
    <select id="mobile-tab-select" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-semibold focus:border-primary focus:outline-none transition-colors">
      <option value="review">Review Submissions</option>
      <option value="events">Manage Events</option>
      <option value="season">Manage Season</option>
      <option value="badges">Configure Badges</option>
      <option value="prizes">Manage Prizes</option>
      <option value="points">Configure Points</option>
    </select>
  </div>

  <!-- Desktop Vertical Sidebar (visible on desktop/tablet only) -->
  <div class="hidden md:flex md:flex-col md:w-48 md:flex-shrink-0 md:mr-6 md:space-y-2">
    <button id="tab-review-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">fact_check</span>
      <span>Review</span>
    </button>
    <button id="tab-events-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">event</span>
      <span>Events</span>
    </button>
    <button id="tab-season-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">calendar_month</span>
      <span>Season</span>
    </button>
    <button id="tab-badges-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">military_tech</span>
      <span>Badges</span>
    </button>
    <button id="tab-prizes-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">redeem</span>
      <span>Prizes</span>
    </button>
    <button id="tab-points-btn" class="admin-tab-btn px-4 py-3 rounded-lg font-semibold text-sm text-left transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-xl">stars</span>
      <span>Points</span>
    </button>
  </div>

  <!-- Tab Content Container --><div class="flex-1 flex flex-col">

  <!-- ===================================================================== -->
  <!-- TAB 1: REVIEW SUBMISSIONS -->
  <!-- ===================================================================== -->
  <div id="tab-review" class="flex-1 flex flex-col overflow-y-auto">
    <!-- Queue Status -->
    <div class="mb-4 text-center">
      <p id="queue-status" class="text-sm text-gray-600 dark:text-gray-400">Loading submissions...</p>
    </div>

    <!-- Main Card Container -->
    <div id="card-container" class="flex-1 flex flex-col justify-center items-center px-4 relative">
      <!-- Swipe Hints -->
      <div class="absolute top-0 left-0 right-0 pt-2 flex justify-between text-xs font-semibold text-gray-400 dark:text-gray-500 px-4 pointer-events-none">
        <span>← Deny</span>
        <span>Approve →</span>
      </div>

      <!-- Card Stack Container -->
      <div id="swipe-card" class="hidden w-full max-w-sm bg-white dark:bg-gray-800 rounded-xl shadow-xl overflow-hidden touch-none select-none relative" style="max-height: 70vh;">
        <!-- Image Section with Double-Tap Indicator -->
        <div class="relative bg-gray-200">
          <img id="card-photo" src="" alt="Submission photo" class="w-full h-40 md:h-64 object-cover">
          <div id="bonus-badge" class="absolute top-3 right-3 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg hidden">
            ✓ +25 bonus
          </div>
          <!-- Mobile hint: Always visible with subtle styling -->
          <div class="md:hidden absolute bottom-2 left-2 right-2 text-center">
            <span class="text-white text-xs font-semibold bg-black/40 px-2 py-1 rounded-full backdrop-blur-sm">Double-tap image for theme bonus</span>
          </div>
          <!-- Desktop hint: Show on hover -->
          <div class="hidden md:flex absolute inset-0 items-center justify-center opacity-0 hover:opacity-100 transition-opacity bg-black/30">
            <span class="text-white text-sm font-semibold bg-black/60 px-4 py-2 rounded-lg">Double-click for theme bonus</span>
          </div>
        </div>

        <!-- Card Content -->
        <div class="p-3 md:p-6 space-y-2 md:space-y-4">
          <div class="space-y-1 md:space-y-2">
            <div class="flex justify-between gap-2">
              <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Student:</span>
              <span id="card-student" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Event:</span>
              <span id="card-event" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Theme:</span>
              <span id="card-theme" class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white text-right"></span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-xs md:text-sm text-gray-600 dark:text-gray-400 flex-shrink-0">Notes:</span>
              <span id="card-notes" class="text-xs md:text-sm text-[#111318] dark:text-white break-words text-right"></span>
            </div>
          </div>

          <!-- Points Display -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-2 md:pt-4">
            <div class="flex justify-between items-center">
              <span class="text-xs md:text-sm font-semibold text-[#111318] dark:text-white">Points:</span>
              <span id="card-points-display" class="text-base md:text-lg font-bold text-primary">50</span>
            </div>
            <div id="points-breakdown" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 md:mt-1 text-right"></div>
          </div>

          <!-- Action Buttons (Hidden on mobile, visible on desktop) -->
          <div class="hidden md:flex border-t border-gray-200 dark:border-gray-700 pt-4 gap-3">
            <button id="btn-deny" class="flex-1 px-4 py-3 rounded-lg bg-secondary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
              <span>✗</span> Deny
            </button>
            <button id="btn-approve" class="flex-1 px-4 py-3 rounded-lg bg-primary hover:bg-opacity-90 text-white font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
              <span>✓</span> Approve
            </button>
          </div>

          <!-- Swipe Instructions (Hidden on mobile, visible on desktop) -->
          <div class="hidden md:block pt-2 text-center text-xs text-gray-400 dark:text-gray-500">
            <p>Or swipe left/right</p>
          </div>
        </div>

        <!-- Swipe Feedback Overlay (drag feedback) -->
        <div id="swipe-feedback" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-lg opacity-0 transition-opacity duration-200"></div>

        <!-- Action Confirmation Overlay (approval/denial feedback) -->
        <div id="confirmation-overlay" class="absolute inset-0 pointer-events-none rounded-xl flex items-center justify-center font-bold text-white text-3xl opacity-0 transition-opacity duration-300" style="background: rgba(0, 0, 0, 0.6);"></div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-12 hidden">
        <p class="text-xl font-bold text-gray-600 dark:text-gray-400 mb-2">All submissions reviewed!</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Great job keeping up with the queue.</p>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB 2: MANAGE EVENTS (Dynamically Loaded) -->
  <!-- ===================================================================== -->
  <div id="tab-events" class="flex-1 flex flex-col hidden overflow-y-auto"></div>

  <!-- ===================================================================== -->
  <!-- TAB 3: SEASON MANAGEMENT (Dynamically Loaded) -->
  <!-- ===================================================================== -->
  <div id="tab-season" class="flex-1 flex flex-col hidden overflow-y-auto"></div>

  <!-- ===================================================================== -->
  <!-- TAB 4: BADGE MANAGEMENT (Dynamically Loaded) -->
  <!-- ===================================================================== -->
  <div id="tab-badges" class="flex-1 flex flex-col hidden overflow-y-auto"></div>

  <!-- ===================================================================== -->
  <!-- TAB 5: SEASON PRIZES MANAGEMENT (Dynamically Loaded) -->
  <!-- ===================================================================== -->
  <div id="tab-prizes" class="flex-1 flex flex-col hidden overflow-y-auto"></div>

  <!-- ===================================================================== -->
  <!-- TAB 6: POINTS CONFIGURATION (Dynamically Loaded) -->
  <!-- ===================================================================== -->
  <div id="tab-points" class="flex-1 flex flex-col hidden overflow-y-auto"></div>

  <style>
    @keyframes slide-right {
      to {
        transform: translateX(150%) rotate(20deg);
        opacity: 0;
      }
    }
    @keyframes slide-left {
      to {
        transform: translateX(-150%) rotate(-20deg);
        opacity: 0;
      }
    }
    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .animate-slide-right {
      animation: slide-right 0.4s ease-in forwards;
    }
    .animate-slide-left {
      animation: slide-left 0.4s ease-in forwards;
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }
    .active-tab {
      background-color: #1b3b87;
    }
  </style>

  <script>
    // =====================================================================
    // ADMIN DASHBOARD - TABLE OF CONTENTS
    // =====================================================================
    // This file is organized into the following sections:
    //
    // 1. TAB MANAGEMENT (Lines ~617-750)
    //    - Tab switching logic
    //    - Mobile/desktop navigation sync
    //    - Lazy loading triggers
    //    - Dynamic tab loading (Phase 3 optimization)
    //
    // 2. REVIEW SUBMISSIONS TAB (Lines ~751-1120)
    //    - Swipe/gesture handlers (touch & mouse)
    //    - Card rendering and image preloading
    //    - Approve/deny submission logic
    //    - Queue management
    //
    // NOTE: Tabs 2-6 (Events, Season, Badges, Prizes, Points) are now
    //       dynamically loaded via getAdminTabHTML() to reduce initial
    //       page load size and improve performance.
    //
    // NOTE: Shared utilities (escapeHTML, showToast, format24To12Hour,
    //       debounce, apiCall) are in Page.admin.utils.html
    //
    // =====================================================================
    // TAB MANAGEMENT
    // =====================================================================
    const reviewTab = document.getElementById('tab-review');
    const eventsTab = document.getElementById('tab-events');
    const seasonTab = document.getElementById('tab-season');
    const badgesTab = document.getElementById('tab-badges');
    const prizesTab = document.getElementById('tab-prizes');
    const pointsTab = document.getElementById('tab-points');
    const reviewBtn = document.getElementById('tab-review-btn');
    const eventsBtn = document.getElementById('tab-events-btn');
    const seasonBtn = document.getElementById('tab-season-btn');
    const badgesBtn = document.getElementById('tab-badges-btn');
    const prizesBtn = document.getElementById('tab-prizes-btn');
    const pointsBtn = document.getElementById('tab-points-btn');

    // Centralized tab switching function
    function switchTab(tabName) {
      // Hide all tabs
      reviewTab.classList.add('hidden');
      eventsTab.classList.add('hidden');
      seasonTab.classList.add('hidden');
      badgesTab.classList.add('hidden');
      prizesTab.classList.add('hidden');
      pointsTab.classList.add('hidden');

      // Reset all button styles - remove active classes and add inactive classes
      const allButtons = [reviewBtn, eventsBtn, seasonBtn, badgesBtn, prizesBtn, pointsBtn];
      allButtons.forEach(btn => {
        // Remove active state classes
        btn.classList.remove('active-tab', 'bg-primary', 'text-white');
        // Add inactive state classes
        btn.classList.add('bg-gray-300', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
      });

      // Show selected tab and style its button
      const tabConfig = {
        'review': {
          tab: reviewTab,
          btn: reviewBtn,
          onShow: () => {
            // Only load queue once to prevent redundant API calls
            if (!queueLoaded) {
              loadAdminQueue();
              queueLoaded = true;
            }
          }
        },
        'events': {
          tab: eventsTab,
          btn: eventsBtn,
          onShow: () => loadTabDynamically('events')
        },
        'season': {
          tab: seasonTab,
          btn: seasonBtn,
          onShow: () => loadTabDynamically('season')
        },
        'badges': {
          tab: badgesTab,
          btn: badgesBtn,
          onShow: () => loadTabDynamically('badges')
        },
        'prizes': {
          tab: prizesTab,
          btn: prizesBtn,
          onShow: () => loadTabDynamically('prizes')
        },
        'points': {
          tab: pointsTab,
          btn: pointsBtn,
          onShow: () => loadTabDynamically('points')
        }
      };

      const selected = tabConfig[tabName];
      if (selected) {
        selected.tab.classList.remove('hidden');
        // Remove inactive classes and add active classes
        selected.btn.classList.remove('bg-gray-300', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
        selected.btn.classList.add('active-tab', 'bg-primary', 'text-white');

        // Sync mobile dropdown selection
        const mobileSelect = document.getElementById('mobile-tab-select');
        if (mobileSelect) {
          mobileSelect.value = tabName;
        }

        // Call tab-specific load function if defined
        if (selected.onShow) {
          selected.onShow();
        }
      }
    }

    // Desktop sidebar button event listeners
    reviewBtn.addEventListener('click', () => {
      switchTab('review');
    });

    eventsBtn.addEventListener('click', () => {
      switchTab('events');
    });

    seasonBtn.addEventListener('click', () => {
      switchTab('season');
    });

    badgesBtn.addEventListener('click', () => {
      switchTab('badges');
    });

    prizesBtn.addEventListener('click', () => {
      switchTab('prizes');
    });

    pointsBtn.addEventListener('click', () => {
      switchTab('points');
    });

    // Mobile dropdown event listener
    const mobileTabSelect = document.getElementById('mobile-tab-select');
    if (mobileTabSelect) {
      mobileTabSelect.addEventListener('change', (e) => {
        switchTab(e.target.value);
      });
    }

    // =====================================================================
    // DYNAMIC TAB LOADING (Phase 3 Optimization)
    // =====================================================================
    const loadedTabs = {
      'review': true  // Review tab is always loaded (inline)
    };

    function loadTabDynamically(tabName) {
      if (loadedTabs[tabName]) {
        return; // Tab already loaded
      }

      const tabContainer = document.getElementById('tab-' + tabName);
      if (!tabContainer) {
        console.error('Tab container not found:', tabName);
        return;
      }

      // Show loading spinner
      showLoadingSpinner(tabContainer, 'Loading ' + tabName + ' tab...');

      // Fetch tab HTML from backend
      apiCall({
        method: 'getAdminTabHTML',
        args: [tabName],
        onSuccess: (response) => {
          // Inject HTML into container
          tabContainer.innerHTML = response.html;

          // --- FIX START: Manually execute scripts ---
          // Find all script tags in the injected HTML
          const scripts = tabContainer.getElementsByTagName('script');
          for (let i = 0; i < scripts.length; i++) {
            const oldScript = scripts[i];
            const newScript = document.createElement('script');

            // Copy all attributes from the old script to the new one
            for (let j = 0; j < oldScript.attributes.length; j++) {
              const attr = oldScript.attributes[j];
              newScript.setAttribute(attr.name, attr.value);
            }

            // Copy the script content
            if (oldScript.innerHTML) {
              newScript.innerHTML = oldScript.innerHTML;
            }

            // Replace the old script with the new one to trigger execution
            oldScript.parentNode.replaceChild(newScript, oldScript);
          }
          // --- FIX END ---

          // Mark tab as loaded
          loadedTabs[tabName] = true;

          console.log('Tab loaded successfully:', tabName);
        },
        onError: (errorMsg) => {
          showError(tabContainer, 'Failed to load tab: ' + errorMsg);
        },
        showErrorToast: true
      });
    }

    // =====================================================================
    // SUBMISSION REVIEW LOGIC (OPTIMIZED FOR SNAPPY UX)
    // =====================================================================
    let currentQueue = [];
    let currentIndex = 0;
    let hasThemeBonus = false;
    const THEME_BONUS_POINTS = 25;
    const BASE_POINTS = 50;
    let queueLoaded = false;  // Track if queue has been loaded to prevent redundant calls

    // Image cache for preloading
    const imageCache = {};
    const PRELOAD_AHEAD = 3;  // Preload 3 cards ahead

    // Touch/Mouse tracking
    let touchStartX = 0;
    let touchStartY = 0;
    let touchCurrentX = 0;
    let isDragging = false;
    let lastTapTime = 0;
    let isProcessing = false;  // Prevent multiple simultaneous swipes

    // Initialize immediately since this script runs after DOM is already ready
    // (the page is server-side rendered and included in Index.html)
    // Initialize the Review tab as active (lazy loading handled by switchTab)
    switchTab('review');
    setupGestureHandlers();

    function setupGestureHandlers() {
      const card = document.getElementById('swipe-card');
      const photo = document.getElementById('card-photo');

      // Touch events
      card.addEventListener('touchstart', handleTouchStart, false);
      card.addEventListener('touchmove', handleTouchMove, false);
      card.addEventListener('touchend', handleTouchEnd, false);

      // Mouse events (for desktop)
      card.addEventListener('mousedown', handleMouseStart, false);
      card.addEventListener('mousemove', handleMouseMove, false);
      card.addEventListener('mouseup', handleMouseEnd, false);

      // Double-tap on image for theme bonus
      photo.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          toggleThemeBonus();
        }
        lastTapTime = now;
      });

      // Button click handlers
      document.getElementById('btn-approve').addEventListener('click', () => {
        if (!isProcessing) {
          isProcessing = true;
          approveCurrentSubmission(true);  // optimistic mode
          setTimeout(() => {
            isProcessing = false;
          }, 200);
        }
      });

      document.getElementById('btn-deny').addEventListener('click', () => {
        if (!isProcessing) {
          isProcessing = true;
          denyCurrentSubmission(true);  // optimistic mode
          setTimeout(() => {
            isProcessing = false;
          }, 200);
        }
      });
    }

    // NOTE: Common utilities like escapeHTML(), showToast(), format24To12Hour(),
    // debounce(), apiCall(), etc. are now in Page.admin.utils.html

    // Show action confirmation overlay (Approved/Denied) - specific to Review tab
    function showConfirmation(message, icon) {
      const overlay = document.getElementById('confirmation-overlay');
      overlay.textContent = icon + ' ' + message;
      overlay.style.opacity = '1';

      // Fade in, hold, fade out
      setTimeout(() => {
        overlay.style.opacity = '0';
      }, 800);  // Hold for 800ms before fading out
    }

    // Preload images for next N cards
    function preloadNextImages() {
      for (let i = currentIndex + 1; i < Math.min(currentIndex + PRELOAD_AHEAD, currentQueue.length); i++) {
        const submission = currentQueue[i];
        if (submission.photoId && !imageCache[submission.photoId]) {
          // Capture photoId in closure to avoid reference issues
          const photoId = submission.photoId;
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[photoId] = response.dataUrl;
            }
          }).serveImage(photoId);
        }
      }
    }

    function handleTouchStart(e) {
      // Check if touch originated from a button - if so, don't interfere
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchCurrentX = touchStartX; // Reset to prevent using stale value
      isDragging = true;
    }

    function handleTouchMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.touches[0].clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleTouchEnd(e) {
      if (!isDragging) return; // Skip if we ignored the touchstart
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function handleMouseStart(e) {
      // Check if click originated from a button - if so, don't interfere
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        return;
      }
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      touchCurrentX = touchStartX; // Reset to prevent using stale value
      isDragging = true;
    }

    function handleMouseMove(e) {
      if (!isDragging) return;
      touchCurrentX = e.clientX;
      updateCardDrag(touchCurrentX - touchStartX);
    }

    function handleMouseEnd(e) {
      if (!isDragging) return; // Skip if we ignored the mousedown
      isDragging = false;
      const distance = touchCurrentX - touchStartX;
      handleSwipeEnd(distance);
    }

    function updateCardDrag(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const maxDistance = window.innerWidth / 2;

      // Apply drag transformation
      const rotation = (distance / maxDistance) * 15;
      const opacity = Math.abs(distance) / maxDistance;

      card.style.transform = `translateX(${distance}px) rotate(${rotation}deg)`;

      // Update feedback text
      if (distance > 50) {
        feedback.textContent = '✓ Approve';
        feedback.style.backgroundColor = 'rgba(34, 197, 94, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else if (distance < -50) {
        feedback.textContent = '✗ Deny';
        feedback.style.backgroundColor = 'rgba(239, 68, 68, 0.7)';
        feedback.style.opacity = Math.min(opacity, 0.8);
      } else {
        feedback.style.opacity = 0;
      }
    }

    function handleSwipeEnd(distance) {
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      const threshold = 100;

      // Prevent multiple simultaneous swipes
      if (isProcessing) return;

      if (distance > threshold) {
        // APPROVE: Swipe right
        isProcessing = true;
        card.classList.add('animate-slide-right');

        // Fire approval action (optimistic - shows next card immediately)
        approveCurrentSubmission(true);
      } else if (distance < -threshold) {
        // DENY: Swipe left
        isProcessing = true;
        card.classList.add('animate-slide-left');

        // Fire denial action (optimistic - shows next card immediately)
        denyCurrentSubmission(true);
      } else {
        // Small swipe - reset card position and feedback
        card.style.transform = '';
        feedback.style.opacity = '0';
      }
    }

    function toggleThemeBonus() {
      hasThemeBonus = !hasThemeBonus;
      const badge = document.getElementById('bonus-badge');
      const breakdown = document.getElementById('points-breakdown');

      if (hasThemeBonus) {
        badge.classList.remove('hidden');
        breakdown.textContent = `Base: ${BASE_POINTS} + Bonus: ${THEME_BONUS_POINTS}`;
      } else {
        badge.classList.add('hidden');
        breakdown.textContent = '';
      }

      updatePointsDisplay();
    }

    function updatePointsDisplay() {
      const total = BASE_POINTS + (hasThemeBonus ? THEME_BONUS_POINTS : 0);
      document.getElementById('card-points-display').textContent = total;
    }

    function loadAdminQueue() {
      google.script.run.withSuccessHandler(populateAdminQueue).getAdminQueue();
    }

    function populateAdminQueue(response) {
      const status = document.getElementById('queue-status');

      if (!response || response.status === 'error') {
        status.innerHTML = `<p class="text-red-600 dark:text-red-400">${escapeHTML(response ? response.message : 'An unexpected error occurred.')}</p>`;
        showEmptyState();
        return;
      }

      currentQueue = response.queue || [];
      currentIndex = 0;
      status.textContent = currentQueue.length === 0 ? 'No pending submissions' : `${currentQueue.length} pending submission(s)`;

      if (currentQueue.length === 0) {
        showEmptyState();
      } else {
        displayCurrentCard();
      }
    }

    function displayCurrentCard() {
      if (currentIndex >= currentQueue.length) {
        showEmptyState();
        return;
      }

      const submission = currentQueue[currentIndex];
      hasThemeBonus = false;

      // Reset card animation and feedback overlay
      const card = document.getElementById('swipe-card');
      const feedback = document.getElementById('swipe-feedback');
      card.classList.remove('animate-slide-right', 'animate-slide-left', 'hidden');
      card.style.transform = '';
      card.classList.add('animate-fade-in');
      feedback.style.opacity = '0';
      feedback.textContent = '';

      // Hide empty state in case it was showing
      document.getElementById('empty-state').classList.add('hidden');

      // Load image from cache (pre-loaded) or fetch if needed
      if (submission.photoId) {
        if (imageCache[submission.photoId]) {
          // Use cached image (instant)
          document.getElementById('card-photo').src = imageCache[submission.photoId];
        } else {
          // Fallback: load image (shouldn't happen with preloading)
          google.script.run.withSuccessHandler((response) => {
            if (response.status === 'success') {
              imageCache[submission.photoId] = response.dataUrl;
              document.getElementById('card-photo').src = response.dataUrl;
            }
          }).serveImage(submission.photoId);
        }
      }

      // Update card content
      document.getElementById('card-student').textContent = submission.email;
      document.getElementById('card-event').textContent = submission.eventName;
      document.getElementById('card-theme').textContent = submission.dressedForTheme ? 'Yes' : 'No';
      document.getElementById('card-notes').textContent = submission.notes || '(none)';
      document.getElementById('bonus-badge').classList.add('hidden');
      document.getElementById('points-breakdown').textContent = '';
      updatePointsDisplay();

      // Preload next images in background
      preloadNextImages();
    }

    function approveCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];

      // Guard: Check if submission exists
      if (!submission) {
        console.error('approveCurrentSubmission: No submission at index', currentIndex);
        showToast('Error: No submission to approve', 'error');
        isProcessing = false;
        return;
      }

      const themeBonusPoints = hasThemeBonus ? THEME_BONUS_POINTS : 0;

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend asynchronously
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Approved', '✓');  // Show confirmation feedback
        isProcessing = false;  // Allow next swipe/click

        // Fire backend approval in background (don't wait for response)
        google.script.run.withSuccessHandler((response) => {
          if (!response || response.status !== 'success') {
            showToast('⚠ Approval failed - check the backend logs', 'error', 4000);
          }
        }).withFailureHandler((error) => {
          showToast('❌ Network error: ' + error, 'error', 4000);
        }).approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      } else {
        // FALLBACK MODE: Wait for backend (used for manual button clicks)
        google.script.run.withSuccessHandler((response) => {
          if (response && response.status === 'success') {
            currentIndex++;
            displayCurrentCard();
          } else {
            showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
            // Reset card for retry
            document.getElementById('swipe-card').style.transform = '';
            document.getElementById('swipe-card').classList.remove('animate-slide-right');
          }
        }).withFailureHandler((error) => {
          showToast('Error: ' + error, 'error');
          // Reset card for retry
          document.getElementById('swipe-card').style.transform = '';
          document.getElementById('swipe-card').classList.remove('animate-slide-right');
        }).approveSubmission(submission.submissionId, BASE_POINTS, themeBonusPoints, 0);
      }
    }

    function denyCurrentSubmission(optimistic = false) {
      const submission = currentQueue[currentIndex];

      // Guard: Check if submission exists
      if (!submission) {
        console.error('denyCurrentSubmission: No submission at index', currentIndex);
        showToast('Error: No submission to deny', 'error');
        isProcessing = false;
        return;
      }

      if (optimistic) {
        // OPTIMISTIC MODE: Show next card immediately, process backend asynchronously
        currentIndex++;
        displayCurrentCard();
        showConfirmation('Denied', '✗');  // Show confirmation feedback
        isProcessing = false;  // Allow next swipe/click

        // Fire backend denial in background (don't wait for response)
        google.script.run.withSuccessHandler((response) => {
          if (!response || response.status !== 'success') {
            showToast('⚠ Denial failed - check the backend logs', 'error', 4000);
          }
        }).withFailureHandler((error) => {
          showToast('❌ Network error: ' + error, 'error', 4000);
        }).denySubmission(submission.submissionId, 'Denied via swipe');
      } else {
        // FALLBACK MODE: Wait for backend (used for manual button clicks)
        google.script.run.withSuccessHandler((response) => {
          if (response && response.status === 'success') {
            currentIndex++;
            displayCurrentCard();
          } else {
            showToast('Error: ' + (response ? response.message : 'An unexpected error occurred.'), 'error');
            // Reset card for retry
            document.getElementById('swipe-card').style.transform = '';
            document.getElementById('swipe-card').classList.remove('animate-slide-left');
          }
        }).withFailureHandler((error) => {
          showToast('Error: ' + error, 'error');
          // Reset card for retry
          document.getElementById('swipe-card').style.transform = '';
          document.getElementById('swipe-card').classList.remove('animate-slide-left');
        }).denySubmission(submission.submissionId, 'Denied via swipe');
      }
    }

    function showEmptyState() {
      document.getElementById('swipe-card').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
    }

    // Helper functions for escaping HTML and JS strings
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeForJs(text) {
      return text.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }
  </script>
