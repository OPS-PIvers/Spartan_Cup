<!--
  This file holds the content for the 'rulebook' page.
  Content is now dynamically loaded from Config_Rulebook sheet.
  Uses accordion/details layout for better mobile UX.
-->
<div class="page pb-24">
  <!-- Top App Bar -->
  <div class="sticky top-0 z-10 flex items-center bg-white dark:bg-gray-800 p-4 pb-2 justify-between border-b border-gray-200 dark:border-gray-800 shadow-sm">
    <div
      class="text-gray-700 dark:text-gray-200 flex size-12 shrink-0 items-center justify-start cursor-pointer"
      onclick="navigateToPage('profile')"
      onkeydown="if(event.key==='Enter'||event.key===' '){navigateToPage('profile');event.preventDefault();}"
      role="button"
      tabindex="0"
      aria-label="Go back to profile"
    >
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </div>
    <h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Rulebook</h2>

    <!-- Admin Edit Button -->
    <div id="adminEditButton" class="hidden flex size-12 shrink-0 items-center justify-end">
      <button
        onclick="openRulebookEditorFromWebApp()"
        class="flex items-center justify-center rounded-full h-10 w-10 bg-primary dark:bg-blue-600 text-white hover:bg-primary/80 dark:hover:bg-blue-700 transition-colors"
        title="Edit Rulebook"
      >
        <span class="material-symbols-outlined text-xl">edit</span>
      </button>
    </div>
    <div id="adminEditPlaceholder" class="flex size-12 shrink-0 items-center"></div>
  </div>

  <!-- Search Bar -->
  <div class="p-4 pb-2 bg-white dark:bg-gray-800">
    <div class="relative">
      <input
        type="text"
        id="rulebookSearch"
        placeholder="Search rulebook..."
        class="w-full px-4 py-2.5 pl-10 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-400 focus:border-transparent"
        onkeyup="filterRulebookSections()"
      />
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xl">search</span>
    </div>
  </div>

  <!-- Loading State -->
  <div id="rulebookLoading" class="p-8 text-center">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-primary dark:border-blue-400"></div>
    <p class="mt-3 text-gray-600 dark:text-gray-400 text-sm">Loading rulebook...</p>
  </div>

  <!-- Accordions Section -->
  <div id="rulebookContent" class="hidden flex flex-col p-4 gap-4"></div>

  <!-- Badge System Section (Dynamic) -->
  <div id="badgeSystemContainer" class="hidden px-4 pb-4">
    <details class="flex flex-col rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900/50 p-4 group">
      <summary class="flex cursor-pointer list-none items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary dark:text-blue-400">
            <span class="material-symbols-outlined">stars</span>
          </div>
          <p class="text-gray-900 dark:text-white text-base font-semibold leading-normal">Badge System</p>
        </div>
        <div class="text-gray-900 dark:text-gray-300 group-open:rotate-180 transition-transform">
          <span class="material-symbols-outlined">expand_more</span>
        </div>
      </summary>
      <div class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-relaxed pt-4 space-y-4">
        <p>Earn bonus points by collecting badges for Participation, Variety, Loyalty, Achievements, and more. Each badge has its own point value and multiplier.</p>
        <div id="badgeCategories" class="space-y-3">
          <p class="text-center text-gray-500 dark:text-gray-400 text-sm">Loading badge information...</p>
        </div>
      </div>
    </details>
  </div>

  <script>
    /**
     * Rulebook Page - Accordion-based Dynamic Content
     * Loads content from Config_Rulebook sheet with improved mobile UX
     */

    let allSections = [];
    let allBadges = [];

    // Check if user is admin and show edit button
    if (APP_DATA && APP_DATA.userIsAdmin) {
      const adminEditBtn = document.getElementById('adminEditButton');
      const adminPlaceholder = document.getElementById('adminEditPlaceholder');
      if (adminEditBtn && adminPlaceholder) {
        adminEditBtn.classList.remove('hidden');
        adminPlaceholder.classList.add('hidden');
      }
    }

    /**
     * Opens the rulebook editor (for admins)
     */
    function openRulebookEditorFromWebApp() {
      const message = `To edit the rulebook:\n\n1. Open the Google Sheet for The Spartan Cup\n2. Click "🏆 Spartan Cup Admin" menu\n3. Select "2b. Edit Rulebook Content"\n\nOr you can edit the Config_Rulebook sheet directly in Google Sheets.`;
      alert(message);
    }

    /**
     * Load rulebook content and badges on page load
     */
    document.addEventListener('DOMContentLoaded', () => {
      loadRulebookContent();
      loadBadgeSystem();
    });

    /**
     * Fetch and render rulebook sections from backend
     */
    function loadRulebookContent() {
      google.script.run
        .withSuccessHandler(renderRulebookSections)
        .withFailureHandler(handleRulebookError)
        .getRulebookContent();
    }

    /**
     * Render the rulebook sections as accordions
     */
    function renderRulebookSections(sections) {
      const container = document.getElementById('rulebookContent');
      const loading = document.getElementById('rulebookLoading');

      loading.classList.add('hidden');
      container.classList.remove('hidden');

      if (!sections || sections.length === 0) {
        container.innerHTML = `
          <div class="text-center p-8 bg-gray-50 dark:bg-gray-900/30 rounded-xl border border-gray-200 dark:border-gray-700">
            <span class="material-symbols-outlined text-5xl text-gray-400 mb-3">description</span>
            <p class="text-gray-600 dark:text-gray-400 text-sm">No rulebook content available yet.</p>
            <p class="text-xs text-gray-500 dark:text-gray-500 mt-2">Admins can add content via the edit button above.</p>
          </div>
        `;
        return;
      }

      allSections = sections;
      container.innerHTML = '';

      // Render each section as an accordion
      sections.forEach(section => {
        const accordion = createAccordion(section);
        container.appendChild(accordion);
      });
    }

    /**
     * Escape HTML to prevent XSS attacks
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**
     * Create an accordion element for a section
     */
    function createAccordion(section) {
      const details = document.createElement('details');

      // Determine if this is a special/warning section
      const isWarning = section.id.includes('misconduct') || section.id.includes('cheat');

      if (isWarning) {
        details.className = 'rulebook-section flex flex-col rounded-xl border-2 border-red-500/50 dark:border-red-500/70 bg-red-500/5 dark:bg-red-500/10 p-4 group';
      } else {
        details.className = 'rulebook-section flex flex-col rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900/50 p-4 group';
      }

      details.setAttribute('data-section-title', section.title.toLowerCase());
      details.setAttribute('data-section-id', section.id);

      // Summary (accordion header)
      const summary = document.createElement('summary');
      summary.className = 'flex cursor-pointer list-none items-center justify-between gap-4';

      const icon = getIconForSection(section.id);
      const iconColor = isWarning ? 'bg-red-500/10 text-red-600 dark:text-red-500' : 'bg-primary/10 text-primary dark:text-blue-400';

      // Build summary with escaped title to prevent XSS
      const titleContainer = document.createElement('div');
      titleContainer.className = 'flex items-center gap-4';
      titleContainer.innerHTML = `
        <div class="flex h-10 w-10 items-center justify-center rounded-full ${iconColor}">
          <span class="material-symbols-outlined">${icon}</span>
        </div>
      `;
      const titleText = document.createElement('p');
      titleText.className = 'text-gray-900 dark:text-white text-base font-semibold leading-normal';
      titleText.textContent = section.title; // Use textContent to prevent XSS
      titleContainer.appendChild(titleText);

      const expandIcon = document.createElement('div');
      expandIcon.className = `${isWarning ? 'text-red-600' : 'text-gray-900 dark:text-gray-300'} group-open:rotate-180 transition-transform`;
      expandIcon.innerHTML = '<span class="material-symbols-outlined">expand_more</span>';

      summary.appendChild(titleContainer);
      summary.appendChild(expandIcon);

      // Content (HTML is intentionally allowed here for rich formatting)
      const content = document.createElement('div');
      content.className = isWarning
        ? 'text-gray-700 dark:text-red-200 text-sm font-normal leading-relaxed pt-4'
        : 'text-gray-600 dark:text-gray-400 text-sm font-normal leading-relaxed pt-4';
      content.innerHTML = section.content; // Admins control this content

      details.appendChild(summary);
      details.appendChild(content);

      return details;
    }

    /**
     * Get appropriate icon for section based on ID
     */
    function getIconForSection(sectionId) {
      const icons = {
        'photo_submission': 'photo_camera',
        'base_points': 'stars',
        'badge_system_intro': 'emoji_events',
        'awards': 'emoji_events',
        'misconduct': 'gavel',
        'points_system': 'stars'
      };
      return icons[sectionId] || 'article';
    }

    /**
     * Handle error loading rulebook
     */
    function handleRulebookError(error) {
      const container = document.getElementById('rulebookContent');
      const loading = document.getElementById('rulebookLoading');

      loading.classList.add('hidden');
      container.classList.remove('hidden');

      container.innerHTML = `
        <div class="text-center p-8 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-200 dark:border-red-800">
          <span class="material-symbols-outlined text-5xl text-red-500 mb-3">error</span>
          <p class="text-red-600 dark:text-red-400 font-semibold text-sm">Error loading rulebook content</p>
          <p class="text-xs text-gray-600 dark:text-gray-400 mt-2">${error.message || 'Unknown error'}</p>
        </div>
      `;
    }

    /**
     * Filter rulebook sections based on search input
     */
    function filterRulebookSections() {
      const searchInput = document.getElementById('rulebookSearch');
      const searchTerm = searchInput.value.toLowerCase();
      const sections = document.querySelectorAll('.rulebook-section');

      sections.forEach(section => {
        const title = section.getAttribute('data-section-title');
        const content = section.textContent.toLowerCase();

        if (title.includes(searchTerm) || content.includes(searchTerm)) {
          section.classList.remove('hidden');
          // Auto-open matched sections when searching
          if (searchTerm.length > 0) {
            section.setAttribute('open', '');
          } else {
            // Close sections when search is cleared
            section.removeAttribute('open');
          }
        } else {
          section.classList.add('hidden');
        }
      });
    }

    /**
     * Load badge system information from Config_Badges
     */
    function loadBadgeSystem() {
      google.script.run
        .withSuccessHandler(renderBadgeSystem)
        .withFailureHandler(handleBadgeError)
        .getAllBadges();
    }

    /**
     * Render badge categories as nested accordions
     */
    function renderBadgeSystem(badges) {
      const container = document.getElementById('badgeCategories');
      const badgeSystemContainer = document.getElementById('badgeSystemContainer');

      if (!badges || badges.length === 0) {
        badgeSystemContainer.classList.add('hidden');
        return;
      }

      badgeSystemContainer.classList.remove('hidden');
      allBadges = badges;

      // Group badges by category
      const categories = {};
      badges.forEach(badge => {
        const category = badge.category || 'Other';
        if (!categories[category]) {
          categories[category] = [];
        }
        categories[category].push(badge);
      });

      container.innerHTML = '';

      // Render each category as a nested accordion
      Object.keys(categories).forEach(categoryName => {
        const categoryBadges = categories[categoryName];

        const details = document.createElement('details');
        details.className = 'flex flex-col rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 p-3 group/inner';

        const summary = document.createElement('summary');
        summary.className = 'flex cursor-pointer list-none items-center justify-between gap-2';
        summary.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-lg text-primary dark:text-blue-400">${getCategoryIcon(categoryName)}</span>
            <p class="text-gray-900 dark:text-gray-200 text-sm font-medium leading-normal">${categoryName} Badges</p>
          </div>
          <div class="text-gray-900 dark:text-gray-400 group-open/inner:rotate-180 transition-transform">
            <span class="material-symbols-outlined text-xl">expand_more</span>
          </div>
        `;

        const badgesList = document.createElement('div');
        badgesList.className = 'pt-3 space-y-2';

        categoryBadges.forEach(badge => {
          const badgeItem = document.createElement('div');
          badgeItem.className = 'flex justify-between items-start gap-2 text-xs';
          badgeItem.innerHTML = `
            <span class="text-gray-700 dark:text-gray-300 flex-1">${badge.badgeName} — ${badge.description}</span>
            <span class="font-semibold text-primary dark:text-blue-400 whitespace-nowrap">${getBadgePointsDisplay(badge)}</span>
          `;
          badgesList.appendChild(badgeItem);
        });

        details.appendChild(summary);
        details.appendChild(badgesList);
        container.appendChild(details);
      });
    }

    /**
     * Get icon for badge category
     */
    function getCategoryIcon(category) {
      const icons = {
        'Participation': 'directions_run',
        'Variety': 'diversity_3',
        'Loyalty': 'favorite',
        'Points': 'emoji_events',
        'Career': 'trending_up',
        'Achievement': 'emoji_events',
        'Special': 'star'
      };
      return icons[category] || 'emoji_events';
    }

    /**
     * Format badge trigger condition display
     * Note: Badges are recognition milestones, not point awards
     */
    function getBadgePointsDisplay(badge) {
      // Show trigger condition instead of points (badges don't award points)
      if (!badge.triggerType || !badge.triggerValue) {
        return '';
      }

      const value = badge.triggerValue;

      // Format based on trigger type
      if (badge.triggerType.includes('Points') || badge.triggerType.includes('points')) {
        return `@ ${value} pts`;
      } else if (badge.triggerType.includes('event') || badge.triggerType.includes('Event') || badge.triggerType.includes('Count')) {
        return `${value} events`;
      } else if (badge.triggerType.includes('Pct') || badge.triggerType.includes('percent')) {
        return `${Math.round(parseFloat(value) * 100)}%`;
      } else if (!isNaN(value)) {
        return `x${value}`;
      }

      return '';
    }

    /**
     * Handle error loading badges
     */
    function handleBadgeError(error) {
      const badgeSystemContainer = document.getElementById('badgeSystemContainer');
      badgeSystemContainer.classList.add('hidden');
      console.error('Error loading badges:', error);
    }
  </script>
</div>
